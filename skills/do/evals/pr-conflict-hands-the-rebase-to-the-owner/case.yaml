name: pr-conflict-hands-the-rebase-to-the-owner
tags: [pr, watch, stop, conflict]
runs: 2
max_turns: 12
timeout_seconds: 300
allowed_tools: [Bash, Read, Edit, Write]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A pull request that conflicts with its base while one of its checks is still pending: a fake
    # gh, first on the session's PATH through the project's settings, answers the CLI check, the
    # read-back and every read with `mergeable` CONFLICTING and merge state DIRTY, so the watch's first
    # call prints verdict=conflict, head=add-archive and base=main. Every gh call is logged in
    # .fake/gh.log with the command line that made it, and the head branch's tip is kept in
    # .fake/head-before, so a run that rebased or pushed it shows in either.
    set -e
    mkdir -p src .fake/bin .claude
    cat > src/notes.js <<'JS'
    const notes = [];

    export function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }
    JS
    cat > .fake/bin/gh <<'SH'
    #!/usr/bin/env bash
    printf '%s\t%s\n' "$*" "$(ps -o args= -p "$PPID" 2>/dev/null)" >> "$GH_FAKE/gh.log"
    expr=
    for ((i = 1; i <= $#; i++)); do
      [ "${!i}" = --jq ] && { j=$((i + 1)); expr="${!j}"; }
    done
    answer() { if [ -n "$expr" ]; then jq -r "$expr"; else cat; fi; }
    case "$1 $2" in
      "auth status") echo "Logged in to github.com account fixture"; exit 0 ;;
      "pr view")
        echo '{"number":42,"headRefName":"add-archive","baseRefName":"main","state":"OPEN","mergeStateStatus":"DIRTY","mergeable":"CONFLICTING","reviewDecision":"REVIEW_REQUIRED"}' | answer ;;
      "pr checks")
        echo '[{"name":"build","bucket":"pass"},{"name":"test","bucket":"pending"}]' | answer ;;
      *) echo "fake gh: no answer recorded for: $*" >&2; exit 1 ;;
    esac
    SH
    chmod +x .fake/bin/gh
    printf '{"env": {"PATH": "%s/.fake/bin:%s", "GH_FAKE": "%s/.fake", "DO_PR_WATCH_SECONDS": "5", "DO_PR_WATCH_INTERVAL": "1"}}\n' \
      "$PWD" "$PATH" "$PWD" > .claude/settings.json
    printf '.fake/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git checkout -q -b add-archive
    printf 'export function archive(note) {\n  note.status = "archived";\n}\n' > src/archive.js
    git -c user.email=fixture@example.com -c user.name=fixture add src/archive.js
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "add archive"
    git rev-parse add-archive > .fake/head-before
