name: setup-recheck-shows-the-next-missing-step
tags: [playbook, setup, stop]
runs: 2
max_turns: 15
timeout_seconds: 300
allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Agent, Skill]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A Setup ticket the developer left claimed, coming back with the word that the init step is
    # done. It is: impeccable is installed, the session lists it and the product context file is
    # committed, with no design system to document. The build path is not set. The run proves the
    # steps by the check, never by the word, and shows the next missing step, the build path.
    #
    # The check reads the install off the plugin records under $HOME, which the runner points at a
    # sandbox no scaffold can reach. So the fixture ships a home of its own with that one record,
    # and its project settings set HOME to it for the session's commands. The reload step is read
    # off the session's own skill listing, so a stand-in impeccable skill sits in the project's
    # .claude/skills; impeccable itself is never run.
    set -e
    mkdir -p src .scratch/notes-cli/issues .claude/skills/impeccable .home/.claude/plugins
    cat > src/notes.js <<'JS'
    const notes = [];
    export function create(title) {
      const note = { id: notes.length + 1, title };
      notes.push(note);
      return note;
    }
    JS
    cat > README.md <<'MD'
    # notes

    A small notes module with a web page to list the notes.
    MD
    printf '.scratch/\n.home/\n' > .gitignore
    echo "# Product" > PRODUCT.md
    cat > .home/.claude/plugins/installed_plugins.json <<'JSON'
    { "version": 2, "plugins": { "impeccable@impeccable": [{ "scope": "user", "installPath": "/x", "version": "4.3.1" }] } }
    JSON
    printf '{ "env": { "HOME": "%s/.home" } }\n' "$PWD" > .claude/settings.json
    cat > .claude/skills/impeccable/SKILL.md <<'MD'
    ---
    name: impeccable
    description: "Stand-in for the impeccable design skill in this fixture. Never invoke it."
    ---

    A stand-in: it does nothing.
    MD
    cat > .scratch/notes-cli/spec.md <<'MD'
    # Spec: Notes list page

    Journey: none
    Front-end: impeccable
    Status: ready-for-agent

    ## Problem Statement

    Notes can be created but never seen: there is no page that lists them.

    ## User Stories

    1. As a user, I want a page that lists my notes, so that I can find one.
    MD
    cat > .scratch/notes-cli/issues/00-set-up-impeccable.md <<'MD'
    # 00: Set up impeccable

    **What to build:** The impeccable setup in this project, run by the developer one step at a time, so the screens of this Spec can be built by impeccable.

    **Blocked by:** None (can start immediately)

    **Status:** claimed

    **Kind:** setup

    - [ ] Install impeccable from a terminal
    - [ ] Reload the coding tool
    - [ ] Initialise the project context in an agent session
    - [ ] Document the design system, when one exists
    - [ ] Set the code-led build path
    - [ ] Commit the setup files on the developer's branch

    ## Evidence
    MD
    cat > .scratch/notes-cli/issues/01-list-the-notes.md <<'MD'
    # 01: List the notes

    **What to build:** A function that returns every note, newest first.

    **Blocked by:** 00 Set up impeccable

    **Status:** ready-for-agent

    **Kind:** logic

    - [ ] Every created note is returned, newest first

    ## Evidence
    MD
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
