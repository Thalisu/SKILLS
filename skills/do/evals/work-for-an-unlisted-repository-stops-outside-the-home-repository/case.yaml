name: work-for-an-unlisted-repository-stops-outside-the-home-repository
tags: [playbook, ticket, stop, repositories, plan]
runs: 1
max_turns: 80
timeout_seconds: 1800
allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Agent, Skill]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # The session runs in billing-service, the Build repository of Ticket 02, whose Feature folder
    # is in orders-service, the Home repository. The Spec lists those two. The Ticket's third
    # criterion is an email template, and every template lives in notifications-service, a sibling
    # repository the Spec does not list: the run stops at the Plan with nothing built, writes the
    # finding into the Spec in the Home repository, and its Reply names the Home repository as the
    # place to open a session in before the tickets command.
    set -e
    mkdir -p src ../orders-service/src ../orders-service/.scratch/hold-disputed-invoice/issues \
      ../notifications-service/src ../notifications-service/templates
    build="$(pwd -P)"
    home="$(cd ../orders-service && pwd -P)"
    notifications="$(cd ../notifications-service && pwd -P)"

    cat > package.json <<'JSON'
    {
      "name": "billing-service",
      "version": "1.0.0",
      "private": true,
      "scripts": {
        "test": "node --test"
      }
    }
    JSON
    cat > README.md <<MD
    # billing-service

    Opens Invoices for Orders. \`node --test\` runs the suite.

    ## What is not here

    This repository sends no email and holds no email template. Every customer email is rendered and
    sent by notifications-service, a repository of its own, checked out on this machine at
    $notifications. Its templates are the files under \`templates/\` there, one per event, and its
    \`src/render.js\` fills them. billing-service only posts an event name and a payload to it,
    through \`src/notify.js\`, and a template that does not exist there makes the post fail with
    \`unknown event\`.
    MD
    cat > src/invoice.js <<'JS'
    const invoices = new Map();
    function open(orderId) { invoices.set(orderId, { orderId, status: "open" }); return invoices.get(orderId); }
    function find(orderId) { return invoices.get(orderId); }
    module.exports = { open, find };
    JS
    cat > src/invoice.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert");
    const { open, find } = require("./invoice");

    test("an opened Invoice reads open", () => {
      open("o-1");
      assert.equal(find("o-1").status, "open");
    });
    JS
    cat > src/notify.js <<'JS'
    // Posts an event to notifications-service, which owns the template of every event.
    async function notify(post, event, payload) { return post("/events", { event, payload }); }
    module.exports = { notify };
    JS

    cat > ../orders-service/README.md <<'MD'
    # orders-service

    Records Orders and their status.
    MD
    cat > ../orders-service/src/order.js <<'JS'
    const orders = new Map();
    function record(id) { orders.set(id, { id, status: "open" }); return orders.get(id); }
    function markDisputed(id) { orders.get(id).status = "disputed"; return orders.get(id); }
    function lookup(id) { return orders.get(id); }
    module.exports = { record, markDisputed, lookup };
    JS

    cat > ../notifications-service/README.md <<'MD'
    # notifications-service

    Renders and sends every customer email. One template per event under `templates/`, filled by
    `src/render.js`.
    MD
    cat > ../notifications-service/templates/order-recorded.txt <<'TXT'
    Subject: Order {{id}} recorded

    We recorded your Order {{id}}.
    TXT
    cat > ../notifications-service/src/render.js <<'JS'
    const fs = require("node:fs");
    const path = require("node:path");
    function render(event, payload) {
      const file = path.join(__dirname, "..", "templates", `${event}.txt`);
      if (!fs.existsSync(file)) throw new Error("unknown event");
      return fs.readFileSync(file, "utf8").replace(/{{(\w+)}}/g, (_, key) => payload[key]);
    }
    module.exports = { render };
    JS

    cat > ../orders-service/.scratch/hold-disputed-invoice/spec.md <<MD
    # Hold the Invoice of a disputed Order

    Journey: not needed, two short paths with no branching
    Status: ready-for-agent

    ## Problem Statement

    A customer disputes an Order and the billing service keeps chasing its open Invoice, and nobody
    tells the customer the chasing has stopped.

    ## Solution

    A support agent marks an Order as disputed, the billing console puts the Order's Invoice on
    hold, and the customer gets an email saying the Invoice is on hold.

    ## Repositories

    - orders-service (Home repository): $home
    - billing-service: $build

    ## User Stories

    1. As a support agent, I want to mark an Order as disputed, so that the dispute is on record where the Order lives
    2. As a support agent, I want to put the Invoice of a disputed Order on hold, so that the customer is not chased while the dispute is open
    3. As a customer, I want an email saying my Invoice is on hold, so that I know nobody will chase me while the dispute is open

    ## Implementation Decisions

    - A held Invoice keeps its Order's id and reads the status held.
    - The email is the event invoice-held, posted by the service that holds the Invoice.

    ## Testing Decisions

    - Taken from the conversation: each module is tested through its exported functions with Node's own test runner.

    ## Out of Scope

    - Lifting a hold once the dispute is closed.
    MD

    cat > ../orders-service/.scratch/hold-disputed-invoice/issues/01-mark-an-order-disputed.md <<'MD'
    # 01: Mark an Order disputed

    **What to build:** A support agent marks an Order as disputed, and the Order's lookup returns that status.

    **Blocked by:** None (can start immediately)

    **Status:** resolved

    **Build repository:** orders-service

    - [x] Marking an Order disputed makes its lookup return the status disputed

    ## Evidence

    - Landed on `main`.
    MD

    cat > ../orders-service/.scratch/hold-disputed-invoice/issues/02-hold-the-invoice-and-tell-the-customer.md <<'MD'
    # 02: Hold the Invoice and tell the customer

    **What to build:** A support agent puts the Invoice of a disputed Order on hold, the Invoice reads held, and the customer gets the email saying the Invoice is on hold.

    **Blocked by:** 01 Mark an Order disputed

    **Status:** ready-for-agent

    **Build repository:** billing-service

    - [ ] Hold on an Invoice sets the Invoice's status to held
    - [ ] Hold on an Invoice posts the event invoice-held with the Order's id through the notify client
    - [ ] The invoice-held email template renders the Order's id in its subject and in its body

    ## Evidence
    MD

    printf '.scratch/\n' > .gitignore
    printf '.scratch/\n' > ../orders-service/.gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    for sibling in ../orders-service ../notifications-service; do
      git -C "$sibling" init -q -b main
      git -C "$sibling" -c user.email=fixture@example.com -c user.name=fixture add -A
      git -C "$sibling" -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    done
