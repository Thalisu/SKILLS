name: completing-run-in-the-provider-lands-its-own-repository
tags: [playbook, ticket, repositories, run, reply, final-integration]
runs: 1
max_turns: 250
timeout_seconds: 5400
allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Agent, Skill]
context:
  unlinked_skills: [do-code-review]
  scaffold_script: |
    #!/usr/bin/env bash
    # The feature spans two repositories and this run completes it. The session runs in
    # billing-service (this fixture folder), the provider: Ticket 02, built in orders-service, the
    # Home repository and a sibling folder, is blocked by Ticket 01, built here. Tickets 01 and 02
    # are resolved and each sits on the Spec branch of its own repository, one commit ahead of
    # main. The run builds Ticket 03, the last open one, built here, so its Completion check reads
    # the feature complete and no unlanded repository provides to billing-service: the run lands
    # billing-service through the Final integration and leaves orders-service to its own session.
    # The review is the fixture's stand-in, which writes a Green Review where it is told and lands
    # by fast-forward, since the case grades the landing and the Reply and never a review.
    set -e
    mkdir -p src .claude/agents .claude/skills/do-code-review ../orders-service/src ../orders-service/.scratch/hold-disputed-invoice/issues
    cat > package.json <<'JSON'
    {
      "name": "billing-service",
      "private": true,
      "scripts": {
        "test": "node --test"
      }
    }
    JSON
    cat > README.md <<'MD'
    # billing-service

    Opens Invoices for Orders. `node --test` runs the suite.
    MD
    cat > CLAUDE.md <<'POLICY_EOF'
    # billing-service

    Opens Invoices for Orders. Tests run with Node's own runner.

    <!-- testing-policy:start v=2.3 surface=consumer -->
    ## Testing Policy (Definition of Done)

    <!-- testing-policy:core-start -->
    A feature or fix is DONE only when the full unit suite passes. "Tests didn't run" is never "tests passed". The rules below are fixed; the project's commands, paths and tool names live in **Project facts** at the end of this section.

    - **Red-first, one test at a time**: write the failing unit test before the implementation, one test per cycle.
    - **Every new test goes through the test author**: dispatch the `unit-test-author` agent, one dispatch per cycle.
    - **Consumer-side E2E**: this repo has no user-facing surface of its own, so its flows live in the repos that consume it (the consumer list in Project facts).
    <!-- testing-policy:core-end -->

    ### Project facts

    - **Unit**: full suite `node --test` · single file `node --test <file>` · mandatory flags / known phantom failures: none; test files are `src/**/*.test.js` · skip mechanisms: `test.skip`, `test.todo`, `{ skip: true }`
    - **Post-feature gate**: none: the unit suite is the whole gate
    - **Consumers**, one line each: repo · E2E tool · run against this repo's local build · single flow · full suite · flow naming · known infra failures
      - orders-service · Node's test runner · its flows require this module from the sibling checkout · single flow `node --test e2e/<flow>.test.js` · full suite `node --test e2e` · flow naming `e2e/<journey>.test.js` · known infra failures: none
    - **Why the agents run in place**: the runner resolves `src/` from the checkout it runs in, so an author in another worktree would test other files
    <!-- testing-policy:end -->
    POLICY_EOF
    cat > .claude/agents/unit-test-author.md <<'AGENT_EOF'
    ---
    name: unit-test-author
    description: Authors and runs one unit test, a new test file or a new test case, after a mandatory reuse audit. Dispatch it for every new unit test; it never writes production code.
    tools: Read, Write, Edit, Bash, Grep, Glob
    ---
    <!-- testing-policy:agent v=2.3 -->

    Write one failing unit test for the behaviour in the dispatch input, as `src/<module>.test.js`
    with `node:test` and `node:assert`, run it once with `node --test <file>`, and return
    `RED_AS_EXPECTED` with the run's output, or `GREEN` when it passes before any implementation.
    Never write production code.
    AGENT_EOF
    cat > .claude/skills/do-code-review/SKILL.md <<'REVIEW_SKILL_EOF'
    ---
    name: do-code-review
    description: Reviews the diff of a branch since a fixed point on six Axes, fixes its Act on Findings through its Fixer and lands the branch on the developer's branch when the Review is Green. Use when do hands over a Ticket or a Spec at its review step, or when the user asks to review a branch.
    ---
    This fixture's stand-in for `do-code-review`: the real skill's call and return, with a Green
    Review. From the reviewed branch's worktree, run

        bash .claude/skills/do-code-review/review.sh $ARGUMENTS

    and return its whole output verbatim as the report. Edit nothing and commit nothing yourself, and
    pass the arguments through exactly as they were given.
    REVIEW_SKILL_EOF
    cat > .claude/skills/do-code-review/review.sh <<'REVIEW_SH_EOF'
    #!/usr/bin/env bash
    # Stand-in for do-code-review in this fixture: the real skill's call and return for a Spec
    # handed over at a Final integration, always Green. Arguments: <spec> <fixed point>
    # <landing target>, then the lines do sends after them; a `Review file: <path>` line among them
    # is where the Review is written, and without one it is written beside the Spec under the
    # Spec's own name. Lands by fast-forward and prints the return the caller reads. Every call is
    # logged under the repository's .git for the graders.
    set -euo pipefail
    common="$(cd "$(git rev-parse --git-common-dir)" && pwd)"
    printf '%s\n' "$*" >> "$common/do-code-review-calls.log"
    for a in "$@"; do
      case "$a" in fix|--no-fix) echo "stand-in: refused the argument $a, which this run never passes"; exit 2;; esac
    done
    spec="${1:?the Spec location}"
    fixed="${2:?the fixed point}"
    target="${3:?the landing target}"
    [ -f "$spec" ] || { echo "$spec is not a Spec file; nothing reviewed"; exit 1; }
    review="$(printf '%s\n' "$*" | sed -n 's/.*Review file: *\([^ `"]*\).*/\1/p' | head -1)"
    [ -n "$review" ] || review="${spec%.md}.review.md"
    main="$(git worktree list --porcelain | sed -n '1s/^worktree //p')"
    branch="$(git branch --show-current)"
    git rev-parse --verify -q "$fixed^{commit}" >/dev/null || { echo "$fixed does not resolve; nothing reviewed"; exit 1; }
    [ -n "$(git diff --stat "$fixed" HEAD)" ] || { echo "no diff between $fixed and the working tree; nothing reviewed"; exit 1; }
    if node --test >/dev/null 2>&1; then suite_line='`node --test`: green'; green=1; else suite_line='`node --test`: red'; green=0; fi
    if [ "$green" = 1 ] && git -C "$main" merge --ff-only -q "$branch" >/dev/null 2>&1; then
      landing="landed at $(git rev-parse --short "$branch")"
    else
      landing="not landed: the fast-forward of $target to $branch failed or the suite is red; the branch and its worktree stay in place"
    fi
    cat > "$review" <<EOF
    # Review: $(basename "$(dirname "$spec")")

    Spec: $spec
    Fixed point: $fixed
    Commit: $(git rev-parse --short HEAD)
    Landing target: $target
    Branch: $branch

    ## Intent

    Hold the Invoice of a disputed Order, and record when it was held.

    ## Safety fact

    The unit suite covers every exported function the diff touches, run in the worktree (Rung 4).

    ## Findings

    ### Act on

    none

    ### Consider

    none

    ### Noted

    none

    ### Cleared

    none

    ## Axes

    - Correctness: 0 findings
    - Spec: 0 findings
    - Standards: 0 findings
    - Principles: 0 findings
    - Blast radius: 0 findings
    - Security: 0 findings

    ## Fix run

    Date: $(date +%F) · at $(git rev-parse --short HEAD)

    - no Act on Finding: no Fixer forked, nothing to fix
    - suite: $suite_line
    - $landing
    EOF
    echo "Review: $review"
    cat "$review"
    echo
    echo "Act on: none"
    echo "Landing: $landing"
    REVIEW_SH_EOF
    chmod +x .claude/skills/do-code-review/review.sh
    cat > src/invoice.js <<'JS'
    const invoices = new Map();
    function open(orderId) { invoices.set(orderId, { orderId, status: "open" }); return invoices.get(orderId); }
    function lookup(orderId) { return invoices.get(orderId); }
    module.exports = { open, lookup };
    JS
    cat > src/invoice.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert");
    const { open, lookup } = require("./invoice.js");

    test("an opened Invoice reads open", () => {
      open("order-1");
      assert.equal(lookup("order-1").status, "open");
    });
    JS

    cat > ../orders-service/README.md <<'MD'
    # orders-service

    Records Orders and their status, and shows each Order's page.
    MD
    cat > ../orders-service/src/order.js <<'JS'
    const orders = new Map();
    function record(id) { orders.set(id, { id, status: "open" }); return orders.get(id); }
    function dispute(id) { orders.get(id).status = "disputed"; return orders.get(id); }
    function lookup(id) { return orders.get(id); }
    module.exports = { record, dispute, lookup };
    JS

    build="$(pwd -P)"
    home="$(cd ../orders-service && pwd -P)"
    cat > ../orders-service/.scratch/hold-disputed-invoice/spec.md <<MD
    # Hold the Invoice of a disputed Order

    Journey: ./journey.md
    Status: ready-for-agent

    ## Problem Statement

    A customer disputes an Order and the billing service keeps chasing its open Invoice.

    ## Solution

    A support agent puts the Invoice of a disputed Order on hold, and the Order's page shows the hold.

    ## Repositories

    - orders-service (Home repository): $home
    - billing-service: $build

    ## User Stories

    1. As a support agent, I want to put the Invoice of a disputed Order on hold, so that the customer is not chased while the dispute is open
    2. As a support agent, I want the Order's page to show that its Invoice is held, so that I can tell the customer nothing is due
    3. As a support agent, I want a held Invoice to carry when it was held, so that I can tell the customer how long the dispute has been open

    ## Implementation Decisions

    - An Invoice carries a status, open or held; a hold never deletes the Invoice
    - The hold is a function of the invoice module, beside open and lookup
    - A held Invoice carries heldAt, the time of the hold as an ISO 8601 string, and an open one carries none

    ## Testing Decisions

    - Behaviour tests through the invoice module's exported functions, with Node's own test runner

    ## Out of Scope

    - Releasing a held Invoice
    MD

    cat > ../orders-service/.scratch/hold-disputed-invoice/journey.md <<'MD'
    # Journey: Hold the Invoice of a disputed Order

    Spec: ./spec.md
    Actor: support agent
    Entry: the Order's page

    ## Path 1: Hold the Invoice

    Story: 1
    Outcome: the Invoice of the disputed Order reads held.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the Invoice of a disputed Order, with a Hold action | picks Hold | the Invoice's status reads held |

    Failure branches:
    - none

    ## Path 2: See the hold on the Order's page

    Story: 2
    Outcome: the Order's page reads that its Invoice is held.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the page of a disputed Order whose Invoice was put on hold | nothing | the page shows the Invoice as held, read from the billing service |

    Failure branches:
    - none

    ## Path 3: See when the Invoice was held

    Story: 3
    Outcome: the held Invoice carries the time of its hold.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | a held Invoice | looks it up | the Invoice carries the time it was put on hold |

    Failure branches:
    - none

    ## States

    | State | The actor sees | Actions |
    |---|---|---|
    | open | the Invoice as open | Hold |
    | held | the Invoice as held, with the time of the hold | none |

    ## Cut

    - none

    ## Defaults taken

    - none

    ## Deferred

    - none

    ## Spec changes applied

    - none

    ## Reopen in discuss

    - none
    MD

    cat > ../orders-service/.scratch/hold-disputed-invoice/issues/01-hold-the-invoice-of-a-disputed-order.md <<'MD'
    # 01: Hold the Invoice of a disputed Order

    **What to build:** A support agent puts the Invoice of a disputed Order on hold.

    **Blocked by:** None (can start immediately)

    **Status:** resolved

    **Build repository:** billing-service

    - [x] Hold on an Order's open Invoice sets the Invoice's status to held

    ## Evidence

    - Landed on `spec/hold-disputed-invoice` in billing-service.
    MD

    cat > ../orders-service/.scratch/hold-disputed-invoice/issues/02-show-the-hold-on-the-order-page.md <<'MD'
    # 02: Show the hold on the Order's page

    **What to build:** The Order's page shows that the Invoice of a disputed Order is held, read from the billing service.

    **Blocked by:** 01 Hold the Invoice of a disputed Order

    **Status:** resolved

    **Build repository:** orders-service

    - [x] The page of a disputed Order whose Invoice was put on hold in the billing service shows the Invoice as held

    ## Evidence

    - Landed on `spec/hold-disputed-invoice` in orders-service.
    MD

    cat > ../orders-service/.scratch/hold-disputed-invoice/issues/03-record-when-the-invoice-was-held.md <<'MD'
    # 03: Record when the Invoice was held

    **What to build:** A held Invoice carries the time it was put on hold.

    **Blocked by:** 01 Hold the Invoice of a disputed Order

    **Status:** ready-for-agent

    **Build repository:** billing-service

    - [ ] The lookup of a held Invoice returns heldAt, the time it was put on hold

    ## Evidence
    MD

    printf '.scratch/\n' > ../orders-service/.gitignore
    commit() { git -C "$1" -c user.email=fixture@example.com -c user.name=fixture commit -q -m "$2"; }
    git init -q -b main
    git add -A
    commit . "fixture"
    # Ticket 01's work, on the Spec branch of billing-service and not on main yet.
    git checkout -q -b spec/hold-disputed-invoice
    cat > src/invoice.js <<'JS'
    const invoices = new Map();
    function open(orderId) { invoices.set(orderId, { orderId, status: "open" }); return invoices.get(orderId); }
    function lookup(orderId) { return invoices.get(orderId); }
    function hold(orderId) {
      const invoice = invoices.get(orderId);
      if (!invoice) return { held: false, reason: "no Invoice is open" };
      invoice.status = "held";
      return { held: true };
    }
    module.exports = { open, lookup, hold };
    JS
    cat >> src/invoice.test.js <<'JS'

    test("a held Invoice reads held", () => {
      const { hold } = require("./invoice.js");
      open("order-2");
      hold("order-2");
      assert.equal(lookup("order-2").status, "held");
    });
    JS
    git add -A
    commit . "feat(invoice): hold the Invoice of a disputed Order"
    git branch -q --set-upstream-to=main spec/hold-disputed-invoice
    git checkout -q main

    git -C ../orders-service init -q -b main
    git -C ../orders-service add -A
    commit ../orders-service "fixture"
    # Ticket 02's work, on the Spec branch of orders-service and not on main yet.
    git -C ../orders-service checkout -q -b spec/hold-disputed-invoice
    cat > ../orders-service/src/page.js <<'JS'
    const { lookup } = require("./order.js");
    function page(id, invoice) {
      const order = lookup(id);
      return `Order ${order.id}: ${order.status}` + (invoice && invoice.status === "held" ? ", Invoice held" : "");
    }
    module.exports = { page };
    JS
    git -C ../orders-service add -A
    commit ../orders-service "feat(page): show the hold on the Order's page"
    git -C ../orders-service branch -q --set-upstream-to=main spec/hold-disputed-invoice
    git -C ../orders-service checkout -q main
