name: pr-fork-head-stops-before-any-watch
tags: [pr, input, security]
runs: 2
max_turns: 20
timeout_seconds: 600
allowed_tools: [Bash, Read, Edit, Write, Agent]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A pull request whose head lives in a fork: a fake gh, first on the session's PATH through the
    # project's settings, answers `pr view` with `isCrossRepository` true and `headRepositoryOwner`
    # contributor, beside a failing `test` check with an Actions job link and a recorded log. The
    # run stops at the read-back, so no `pr checks` call, no `run view` call, no worktree and no
    # fixer follow. Every gh call is logged with its command line in .fake/gh.log.
    set -e
    mkdir -p src .fake/bin .claude
    printf '# notes\n' > README.md
    printf '.fake/\n' > .gitignore
    printf 'export const total = (xs) => xs.reduce((a, b) => a + b, 1);\n' > src/total.js
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    printf 'test\tRun tests\t2026-10-14T12:00:01.2000000Z FAIL total: got 6, want 5\n' > .fake/log
    cat > .fake/bin/gh <<'SH'
    #!/usr/bin/env bash
    printf '%s\t%s\n' "$*" "$(ps -o args= -p "$PPID" 2>/dev/null)" >> "$GH_FAKE/gh.log"
    expr=
    for ((i = 1; i <= $#; i++)); do
      [ "${!i}" = --jq ] && { j=$((i + 1)); expr="${!j}"; }
    done
    answer() { if [ -n "$expr" ]; then jq -r "$expr"; else cat; fi; }
    case "$1 $2" in
      "auth status") echo "Logged in to github.com account fixture"; exit 0 ;;
      "pr view")
        printf '{"number":12,"headRefName":"main","baseRefName":"main","state":"OPEN","isCrossRepository":true,"headRepositoryOwner":{"login":"contributor"},"headRepository":{"name":"notes"},"mergeStateStatus":"UNSTABLE","mergeable":"MERGEABLE","headRefOid":"0123456789abcdef0123456789abcdef01234567"}\n' | answer ;;
      "pr checks")
        printf '[{"name":"test","bucket":"fail","link":"https://github.com/acme/notes/actions/runs/7/job/99"}]\n' | answer ;;
      "run view") cat "$GH_FAKE/log" ;;
      *) echo "fake gh: no answer recorded for: $*" >&2; exit 1 ;;
    esac
    SH
    chmod +x .fake/bin/gh
    printf '{"env": {"PATH": "%s/.fake/bin:%s", "GH_FAKE": "%s/.fake"}}\n' \
      "$PWD" "$PATH" "$PWD" > .claude/settings.json
    printf '.claude/\n' >> .git/info/exclude
