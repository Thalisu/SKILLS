    cat > .scratch/hold-disputed-invoice/issues/02-mark-an-order-disputed-and-tell-the-customer.plan.md <<'MD'
    ## Sources

    ticket: .scratch/hold-disputed-invoice/issues/02-mark-an-order-disputed-and-tell-the-customer.md 1f0e5c2a9b7d4e6f8a1b3c5d7e9f0a2b4c6d8e0f
    digest: .scratch/hold-disputed-invoice/issues/02-mark-an-order-disputed-and-tell-the-customer.digest.md 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b

    ## Grounding

