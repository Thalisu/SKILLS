name: ticket-stopped-at-the-plan-plans-again-once-its-blocker-is-resolved
tags: [playbook, ticket, run, resume, repositories, plan]
runs: 1
max_turns: 150
timeout_seconds: 2400
allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Agent, Skill]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # The fixture of work-for-a-listed-repository-stops-at-the-plan after that stop and after
    # `tickets`: the session runs in orders-service, the Home repository, on Ticket 02, built there.
    # The email template the first run stopped on is now Ticket 03, built in notifications-service
    # and already resolved, with its template in that repository. Ticket 02 holds the two criteria
    # `tickets` left it, is blocked by Ticket 03 alone, still reads ready-for-agent, and has the
    # Plan of the stopped run beside it, cut from three criteria. The run removes that Plan, plans
    # Ticket 02 again from the two criteria, builds them and ends as a ticket run does.
    set -e
    mkdir -p src .scratch/hold-disputed-invoice/issues ../billing-service/src \
      ../notifications-service/src ../notifications-service/templates
    home="$(pwd -P)"
    billing="$(cd ../billing-service && pwd -P)"
    notifications="$(cd ../notifications-service && pwd -P)"

    cat > package.json <<'JSON'
    {
      "name": "orders-service",
      "version": "1.0.0",
      "private": true,
      "scripts": {
        "test": "node --test"
      }
    }
    JSON
    cat > README.md <<MD
    # orders-service

    Records Orders and their status. \`node --test\` runs the suite.

    ## What is not here

    This repository sends no email and holds no email template. Every customer email is rendered and
    sent by notifications-service, a repository of its own, checked out on this machine at
    $notifications. Its templates are the files under \`templates/\` there, one per event, and its
    \`src/render.js\` fills them. orders-service only posts an event name and a payload to it,
    through \`src/notify.js\`, and a template that does not exist there makes the post fail with
    \`unknown event\`.
    MD
    cat > src/order.js <<'JS'
    const orders = new Map();
    function record(id) { orders.set(id, { id, status: "open" }); return orders.get(id); }
    function lookup(id) { return orders.get(id); }
    module.exports = { record, lookup };
    JS
    cat > src/order.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert");
    const { record, lookup } = require("./order");

    test("a recorded Order reads open", () => {
      record("o-1");
      assert.equal(lookup("o-1").status, "open");
    });
    JS
    cat > src/notify.js <<'JS'
    // Posts an event to notifications-service, which owns the template of every event.
    async function notify(post, event, payload) { return post("/events", { event, payload }); }
    module.exports = { notify };
    JS

    cat > ../billing-service/README.md <<'MD'
    # billing-service

    Opens Invoices for Orders.
    MD
    cat > ../billing-service/src/invoice.js <<'JS'
    const invoices = new Map();
    function open(orderId) { invoices.set(orderId, { orderId, status: "open" }); return invoices.get(orderId); }
    module.exports = { open };
    JS

    cat > ../notifications-service/README.md <<'MD'
    # notifications-service

    Renders and sends every customer email. One template per event under `templates/`, filled by
    `src/render.js`.
    MD
    cat > ../notifications-service/templates/order-recorded.txt <<'TXT'
    Subject: Order {{id}} recorded

    We recorded your Order {{id}}.
    TXT
    cat > ../notifications-service/templates/dispute-received.txt <<'TXT'
    Subject: Dispute on Order {{id}} received

    We received your dispute on Order {{id}}.
    TXT
    cat > ../notifications-service/src/render.js <<'JS'
    const fs = require("node:fs");
    const path = require("node:path");
    function render(event, payload) {
      const file = path.join(__dirname, "..", "templates", `${event}.txt`);
      if (!fs.existsSync(file)) throw new Error("unknown event");
      return fs.readFileSync(file, "utf8").replace(/{{(\w+)}}/g, (_, key) => payload[key]);
    }
    module.exports = { render };
    JS

    cat > .scratch/hold-disputed-invoice/spec.md <<MD
    # Hold the Invoice of a disputed Order

    Journey: not needed, two short paths with no branching
    Status: ready-for-agent

    ## Problem Statement

    A customer disputes an Order, nobody tells them the dispute was received, and the billing
    service keeps chasing its open Invoice.

    ## Solution

    A support agent marks an Order as disputed, the customer gets an email saying the dispute was
    received, and the billing console puts the Order's Invoice on hold.

    ## Repositories

    - orders-service (Home repository): $home
    - billing-service: $billing
    - notifications-service: $notifications

    ## User Stories

    1. As a support agent, I want to mark an Order as disputed, so that the dispute is on record where the Order lives
    2. As a customer, I want an email saying my dispute was received, so that I know somebody is looking at it
    3. As a support agent, I want to put the Invoice of a disputed Order on hold, so that the customer is not chased while the dispute is open

    ## Implementation Decisions

    - A disputed Order keeps its id and reads the status disputed.
    - The email is the event dispute-received, posted by the service that records the dispute.
    - Moved by the run on Ticket 02: Mark an Order disputed and tell the customer at the Plan step: the dispute-received email template renders the Order's id in its subject and in its body. Belongs to: notifications-service.

    ## Testing Decisions

    - Taken from the conversation: each module is tested through its exported functions with Node's own test runner.

    ## Out of Scope

    - Lifting a hold once the dispute is closed.
    MD

