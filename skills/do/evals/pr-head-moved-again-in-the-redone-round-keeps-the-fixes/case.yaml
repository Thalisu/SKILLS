name: pr-head-moved-again-in-the-redone-round-keeps-the-fixes
tags: [pr, watch, fix, push]
runs: 2
max_turns: 100
timeout_seconds: 2700
allowed_tools: [Bash, Read, Edit, Write, Agent]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A pull request whose `test` check failed on a planted defect: `total` starts its sum at 1, so
    # `bash tests/total.sh` fails locally exactly as the recorded CI log says. Its head `add-total`
    # is a branch another writer pushes to. The developer has it checked out with an untracked note
    # of their own, and the remote is a bare repository under .fake/. A fake gh, first on the
    # session's PATH through the project's settings, reads the remote's head on every call and
    # serves `test` failed while `total 2 3` at that head is not 5. The first two times the log of
    # job 99 is read, which happens once per attempt at the round, after its run tree was cut and
    # before its push, the other writer pushes a commit of their own to `add-total` that leaves
    # `total` alone. So the round meets a moved head before its push, is redone on the moved head,
    # and meets it moved again before the redone round's push. Each other writer's commit is
    # appended to .fake/other.shas, and every gh call is logged in .fake/gh.log.
    set -e
    mkdir -p src tests .github/workflows .fake/bin .claude
    printf '# notes\n' > README.md
    printf '.fake/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git checkout -q -b add-total
    cat > src/total.sh <<'SH'
    total() {
      local sum=1 n
      for n in "$@"; do
        sum=$((sum + n))
      done
      echo "$sum"
    }
    SH
    cat > tests/total.sh <<'SH'
    #!/usr/bin/env bash
    . "$(dirname "$0")/../src/total.sh"
    got="$(total 2 3)"
    [ "$got" = 5 ] || { echo "FAIL total 2 3: got $got, want 5"; exit 1; }
    echo "ok    total 2 3"
    SH
    cat > .github/workflows/ci.yml <<'YML'
    name: ci
    on: pull_request
    jobs:
      test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Run tests
            run: bash tests/total.sh
    YML
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "add total"
    git clone -q --bare . .fake/remote.git
    git remote add origin "$PWD/.fake/remote.git"
    git fetch -q origin
    git branch -q -u origin/add-total
    git rev-parse HEAD > .fake/red.sha
    : > .fake/other.shas
    printf 'wip: ask about totals of an empty list\n' > NOTES.md
    printf 'test\tRun tests\t2026-10-14T12:00:01.1000000Z ##[group]Run bash tests/total.sh\n' > .fake/log
    printf 'test\tRun tests\t2026-10-14T12:00:01.2000000Z \033[31mFAIL total 2 3: got 6, want 5\033[0m\n' >> .fake/log
    printf 'test\tRun tests\t2026-10-14T12:00:01.3000000Z /home/runner/work/notes/notes/tests/total.sh exited 1\n' >> .fake/log
    printf 'test\tRun tests\t2026-10-14T12:00:01.4000000Z ##[error]Process completed with exit code 1.\n' >> .fake/log
    cat > .fake/bin/gh <<'SH'
    #!/usr/bin/env bash
    printf '%s\t%s\n' "$*" "$(ps -o args= -p "$PPID" 2>/dev/null)" >> "$GH_FAKE/gh.log"
    expr=
    for ((i = 1; i <= $#; i++)); do
      [ "${!i}" = --jq ] && { j=$((i + 1)); expr="${!j}"; }
    done
    answer() { if [ -n "$expr" ]; then jq -r "$expr"; else cat; fi; }
    head="$(git --git-dir="$GH_FAKE/remote.git" rev-parse refs/heads/add-total)"
    green() {
      local d got
      d="$(mktemp -d)"
      git --git-dir="$GH_FAKE/remote.git" show "$head:src/total.sh" > "$d/total.sh"
      got="$(. "$d/total.sh"; total 2 3)"
      rm -rf "$d"
      [ "$got" = 5 ]
    }
    other_writer_pushes() {
      local d n
      n="$(($(wc -l < "$GH_FAKE/other.shas") + 1))"
      d="$(mktemp -d)"
      git clone -q -b add-total "$GH_FAKE/remote.git" "$d/c"
      mkdir -p "$d/c/docs"
      printf 'release note %s from the other writer\n' "$n" > "$d/c/docs/release-$n.md"
      git -C "$d/c" add docs
      git -C "$d/c" -c user.email=other@example.com -c user.name=other commit -q -m "docs: release note $n"
      git -C "$d/c" push -q origin add-total
      git -C "$d/c" rev-parse HEAD >> "$GH_FAKE/other.shas"
      rm -rf "$d"
    }
    case "$1 $2" in
      "auth status") echo "Logged in to github.com account fixture"; exit 0 ;;
      "pr view")
        if green; then merge=CLEAN; else merge=UNSTABLE; fi
        printf '{"number":42,"headRefName":"add-total","baseRefName":"main","state":"OPEN","mergeStateStatus":"%s","mergeable":"MERGEABLE","headRefOid":"%s"}\n' \
          "$merge" "$head" | answer ;;
      "pr checks")
        if green; then test=pass; else test=fail; fi
        printf '[{"name":"lint","bucket":"pass","link":"https://github.com/acme/notes/actions/runs/7/job/98"},{"name":"test","bucket":"%s","link":"https://github.com/acme/notes/actions/runs/7/job/99"}]\n' \
          "$test" | answer ;;
      "run view")
        [ "$*" = "run view --job 99 --repo github.com/acme/notes --log-failed" ] || {
          echo "fake gh: no answer recorded for: $*" >&2
          exit 1
        }
        [ "$(wc -l < "$GH_FAKE/other.shas")" -lt 2 ] && other_writer_pushes
        cat "$GH_FAKE/log" ;;
      *) echo "fake gh: no answer recorded for: $*" >&2; exit 1 ;;
    esac
    SH
    chmod +x .fake/bin/gh
    printf '{"env": {"PATH": "%s/.fake/bin:%s", "GH_FAKE": "%s/.fake", "DO_PR_WATCH_SECONDS": "5", "DO_PR_WATCH_INTERVAL": "1"}}\n' \
      "$PWD" "$PATH" "$PWD" > .claude/settings.json
    printf '.claude/\n' >> .git/info/exclude
