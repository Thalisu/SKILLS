name: pr-awaiting-approval-reply-says-so
tags: [pr, watch, reply, approval]
runs: 2
max_turns: 12
timeout_seconds: 300
allowed_tools: [Bash, Read, Edit, Write]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A pull request whose checks all passed and whose merge is blocked on a required review: a fake
    # gh, first on the session's PATH through the project's settings, answers the CLI check, the
    # read-back and every `pr checks` read with both checks passing, so the watch's first call prints
    # verdict=awaiting-approval and checks=2. The fake answers `pr merge` too, so a run that merges is
    # caught in .fake/gh.log, where every gh call is logged with the command line that made it.
    set -e
    mkdir -p src .fake/bin .claude
    cat > src/notes.js <<'JS'
    const notes = [];

    export function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }
    JS
    cat > .fake/bin/gh <<'SH'
    #!/usr/bin/env bash
    printf '%s\t%s\n' "$*" "$(ps -o args= -p "$PPID" 2>/dev/null)" >> "$GH_FAKE/gh.log"
    expr=
    for ((i = 1; i <= $#; i++)); do
      [ "${!i}" = --jq ] && { j=$((i + 1)); expr="${!j}"; }
    done
    answer() { if [ -n "$expr" ]; then jq -r "$expr"; else cat; fi; }
    case "$1 $2" in
      "auth status") echo "Logged in to github.com account fixture"; exit 0 ;;
      "pr view")
        echo '{"number":42,"headRefName":"add-archive","baseRefName":"main","state":"OPEN","mergeStateStatus":"BLOCKED","mergeable":"MERGEABLE","reviewDecision":"REVIEW_REQUIRED"}' | answer ;;
      "pr checks")
        echo '[{"name":"build","bucket":"pass"},{"name":"test","bucket":"pass"}]' | answer ;;
      "pr merge") echo "Merged pull request #42"; exit 0 ;;
      *) echo "fake gh: no answer recorded for: $*" >&2; exit 1 ;;
    esac
    SH
    chmod +x .fake/bin/gh
    printf '{"env": {"PATH": "%s/.fake/bin:%s", "GH_FAKE": "%s/.fake", "DO_PR_WATCH_SECONDS": "5", "DO_PR_WATCH_INTERVAL": "1"}}\n' \
      "$PWD" "$PATH" "$PWD" > .claude/settings.json
    printf '.fake/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
