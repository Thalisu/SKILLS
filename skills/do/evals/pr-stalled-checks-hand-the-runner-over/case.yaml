name: pr-stalled-checks-hand-the-runner-over
tags: [pr, watch, stop, stall]
runs: 2
max_turns: 16
timeout_seconds: 300
allowed_tools: [Bash, Read, Edit, Write]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A pull request whose two pending checks never change: a fake gh, first on the session's PATH
    # through the project's settings, answers every `pr checks` read with `lint` passed and
    # `build (ubuntu-latest, 3.11)` and `deploy` pending. A fake `date` beside it moves the epoch
    # clock 20 minutes forward on each `date +%s` call, so the watch's 60-minute window of unchanged
    # checks runs out in seconds instead of an hour, and the watch prints verdict=stalled with one
    # pending= line per pending check. Every gh call is logged in .fake/gh.log.
    set -e
    mkdir -p src .fake/bin .claude
    cat > src/notes.js <<'JS'
    const notes = [];

    export function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }
    JS
    cat > .fake/bin/gh <<'SH'
    #!/usr/bin/env bash
    printf '%s\t%s\n' "$*" "$(ps -o args= -p "$PPID" 2>/dev/null)" >> "$GH_FAKE/gh.log"
    expr=
    for ((i = 1; i <= $#; i++)); do
      [ "${!i}" = --jq ] && { j=$((i + 1)); expr="${!j}"; }
    done
    answer() { if [ -n "$expr" ]; then jq -r "$expr"; else cat; fi; }
    case "$1 $2" in
      "auth status") echo "Logged in to github.com account fixture"; exit 0 ;;
      "pr view")
        echo '{"number":42,"headRefName":"add-archive","baseRefName":"main","state":"OPEN","mergeStateStatus":"UNKNOWN","mergeable":"UNKNOWN","reviewDecision":"REVIEW_REQUIRED"}' | answer ;;
      "pr checks")
        echo '[{"name":"lint","bucket":"pass"},{"name":"build (ubuntu-latest, 3.11)","bucket":"pending"},{"name":"deploy","bucket":"pending"}]' | answer ;;
      *) echo "fake gh: no answer recorded for: $*" >&2; exit 1 ;;
    esac
    SH
    real_date="$(command -v date)"
    cat > .fake/bin/date <<SH
    #!/usr/bin/env bash
    if [ "\$*" = +%s ]; then
      n=\$((\$(cat "\$GH_FAKE/date.calls" 2>/dev/null || echo 0) + 1))
      echo "\$n" > "\$GH_FAKE/date.calls"
      echo \$((\$("$real_date" +%s) + (n - 1) * 1200))
    else
      exec "$real_date" "\$@"
    fi
    SH
    chmod +x .fake/bin/gh .fake/bin/date
    printf '{"env": {"PATH": "%s/.fake/bin:%s", "GH_FAKE": "%s/.fake", "DO_PR_WATCH_SECONDS": "5", "DO_PR_WATCH_INTERVAL": "1"}}\n' \
      "$PWD" "$PATH" "$PWD" > .claude/settings.json
    printf '.fake/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
