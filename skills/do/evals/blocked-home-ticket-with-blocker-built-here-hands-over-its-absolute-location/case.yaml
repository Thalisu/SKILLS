name: blocked-home-ticket-with-blocker-built-here-hands-over-its-absolute-location
tags: [playbook, ticket, stop, repositories]
runs: 2
max_turns: 12
timeout_seconds: 300
allowed_tools: [Bash, Read, Edit, Write]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # The fixture of `blocked-home-ticket-names-the-blocker-build-repository` with one more Ticket:
    # the session runs in billing-service, the Tickets live in orders-service, the Home repository,
    # and Ticket 03 is blocked by Ticket 02, still ready-for-agent and built in billing-service
    # like Ticket 03 itself. The run is refused before the claim, and the command that builds the
    # blocker runs from this same session, so no line names a repository to go to.
    set -e
    mkdir -p src ../orders-service/src ../orders-service/.scratch/hold-disputed-invoice/issues
    cat > README.md <<'MD'
    # billing-service

    Opens Invoices for Orders.
    MD
    cat > src/invoice.js <<'JS'
    const invoices = new Map();
    function open(orderId) { invoices.set(orderId, { orderId, status: "open" }); return invoices.get(orderId); }
    module.exports = { open };
    JS
    cat > ../orders-service/README.md <<'MD'
    # orders-service

    Records Orders and their status.
    MD
    cat > ../orders-service/src/order.js <<'JS'
    const orders = new Map();
    function record(id) { orders.set(id, { id, status: "open" }); return orders.get(id); }
    function lookup(id) { return orders.get(id); }
    module.exports = { record, lookup };
    JS

    build="$(pwd -P)"
    home="$(cd ../orders-service && pwd -P)"
    cat > ../orders-service/.scratch/hold-disputed-invoice/spec.md <<MD
    # Hold the Invoice of a disputed Order

    Journey: not needed, three short paths with no branching
    Status: ready-for-agent

    ## Problem Statement

    A customer disputes an Order and the billing service keeps chasing its open Invoice.

    ## Solution

    A support agent marks an Order as disputed, the billing service puts its Invoice on hold, and
    releases it when the dispute closes.

    ## Repositories

    - orders-service (Home repository): $home
    - billing-service: $build

    ## User Stories

    1. As a support agent, I want to mark an Order as disputed, so that the dispute is on record where the Order lives
    2. As a support agent, I want to put the Invoice of a disputed Order on hold, so that the customer is not chased while the dispute is open
    3. As a support agent, I want to release a held Invoice, so that billing resumes once the dispute closes
    MD

    cat > ../orders-service/.scratch/hold-disputed-invoice/issues/01-mark-an-order-disputed.md <<'MD'
    # 01: Mark an Order disputed

    **What to build:** A support agent marks an Order as disputed, and the Order's lookup returns that status.

    **Blocked by:** None (can start immediately)

    **Status:** resolved

    **Build repository:** orders-service

    - [x] Marking an Order disputed makes its lookup return the status disputed

    ## Evidence

    - Landed on `main`.
    MD

    cat > ../orders-service/.scratch/hold-disputed-invoice/issues/02-hold-the-invoice-of-a-disputed-order.md <<'MD'
    # 02: Hold the Invoice of a disputed Order

    **What to build:** A support agent puts the Invoice of a disputed Order on hold.

    **Blocked by:** 01 Mark an Order disputed

    **Status:** ready-for-agent

    **Build repository:** billing-service

    - [ ] Hold on an Order's open Invoice sets the Invoice's status to held

    ## Evidence
    MD

    cat > ../orders-service/.scratch/hold-disputed-invoice/issues/03-release-a-held-invoice.md <<'MD'
    # 03: Release a held Invoice

    **What to build:** A support agent releases a held Invoice, and its status reads open again.

    **Blocked by:** 02 Hold the Invoice of a disputed Order

    **Status:** ready-for-agent

    **Build repository:** billing-service

    - [ ] Release on a held Invoice sets the Invoice's status to open

    ## Evidence
    MD

    printf '.scratch/\n' > ../orders-service/.gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git -C ../orders-service init -q -b main
    git -C ../orders-service -c user.email=fixture@example.com -c user.name=fixture add -A
    git -C ../orders-service -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
