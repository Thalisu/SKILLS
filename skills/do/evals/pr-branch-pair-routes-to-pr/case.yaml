name: pr-branch-pair-routes-to-pr
tags: [router, pr]
runs: 2
max_turns: 6
timeout_seconds: 300
allowed_tools: [Bash, Read, Edit, Write]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # Words asking for a pull request from `dev` into `prod`, both branches present with a commit
    # between them: the request could read as an integration of `dev` into `prod`, and the router's
    # `pr` row above the `integrate` row takes it first. A fake gh, first on the session's PATH
    # through the project's settings, answers that it is not logged in, so the run stops at its door
    # and nothing reaches GitHub.
    set -e
    mkdir -p src .fake/bin .claude
    cat > src/notes.js <<'JS'
    const notes = [];

    export function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }
    JS
    cat > .fake/bin/gh <<'SH'
    #!/usr/bin/env bash
    printf '%s\n' "$*" >> "$GH_FAKE/gh.log"
    echo "You are not logged into any GitHub hosts. To log in, run: gh auth login" >&2
    exit 1
    SH
    chmod +x .fake/bin/gh
    printf '{"env": {"PATH": "%s/.fake/bin:%s", "GH_FAKE": "%s/.fake"}}\n' \
      "$PWD" "$PATH" "$PWD" > .claude/settings.json
    printf '.fake/\n' > .gitignore
    git init -q -b dev
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git branch prod
    printf 'export function archive(note) {\n  note.status = "archived";\n  return note;\n}\n' >> src/notes.js
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -am "feat: archive a note"
