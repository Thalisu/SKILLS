name: landing-command-in-the-next-repository-lands-it
tags: [playbook, ticket, repositories, run, resume, final-integration]
runs: 1
max_turns: 150
timeout_seconds: 3600
allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Agent, Skill]
context:
  unlinked_skills: [do-code-review]
  scaffold_script: |
    #!/usr/bin/env bash
    # The feature spans three sibling repositories and every Ticket of it reads resolved, so this
    # run builds nothing: it is the landing command the last Reply handed over, typed in the next
    # repository to land. The blocking edges order the three. ledger-service, the first provider
    # (Ticket 01), already landed: its work is on its main and its Spec branch is gone.
    # billing-service (this fixture folder, the Home repository, Ticket 02, blocked by 01) is where
    # the session runs: its Spec branch is one commit ahead of main and every provider of it
    # landed. orders-service (Ticket 03, blocked by 02) consumes from billing-service and is still
    # to land, its Spec branch one commit ahead of its main.
    # billing-service has a Gate command of its own, `npm test`, which leaves a line under its
    # .git on every run; the other two repositories run `node --test` and leave none. The review
    # is the fixture's stand-in, which writes a Green Review where it is told, lands by
    # fast-forward and logs the claim files it finds beside the Spec, since the case grades the
    # landing and never a review.
    set -e
    mkdir -p src scripts .claude/agents .claude/skills/do-code-review .scratch/hold-disputed-invoice/issues \
      ../ledger-service/src ../orders-service/src
    cat > package.json <<'JSON'
    {
      "name": "billing-service",
      "private": true,
      "scripts": {
        "test": "bash scripts/suite.sh"
      }
    }
    JSON
    cat > scripts/suite.sh <<'SUITE_EOF'
    #!/usr/bin/env bash
    # billing-service's unit suite. Every run leaves one line in the repository's .git, which the
    # team reads to tell how often the suite runs and from which checkout.
    set -euo pipefail
    common="$(cd "$(git rev-parse --git-common-dir)" && pwd)"
    printf 'billing-service suite ran in %s\n' "$(pwd -P)" >> "$common/billing-service-suite.log"
    exec node --test
    SUITE_EOF
    chmod +x scripts/suite.sh
    cat > README.md <<'MD'
    # billing-service

    Opens Invoices for Orders. `npm test` runs the suite.
    MD
    cat > CLAUDE.md <<'POLICY_EOF'
    # billing-service

    Opens Invoices for Orders. Tests run through `npm test`, which wraps Node's own runner.

    <!-- testing-policy:start v=2.3 surface=consumer -->
    ## Testing Policy (Definition of Done)

    <!-- testing-policy:core-start -->
    A feature or fix is DONE only when the full unit suite passes. "Tests didn't run" is never "tests passed". The rules below are fixed; the project's commands, paths and tool names live in **Project facts** at the end of this section.

    - **Red-first, one test at a time**: write the failing unit test before the implementation, one test per cycle.
    - **Every new test goes through the test author**: dispatch the `unit-test-author` agent, one dispatch per cycle.
    - **Consumer-side E2E**: this repo has no user-facing surface of its own, so its flows live in the repos that consume it (the consumer list in Project facts).
    <!-- testing-policy:core-end -->

    ### Project facts

    - **Unit**: full suite `npm test` · single file `node --test <file>` · mandatory flags / known phantom failures: none; test files are `src/**/*.test.js` · skip mechanisms: `test.skip`, `test.todo`, `{ skip: true }`
    - **Post-feature gate**: full unit suite
    - **Consumers**, one line each: repo · E2E tool · run against this repo's local build · single flow · full suite · flow naming · known infra failures
      - orders-service · none: it has no end-to-end suite yet
    - **Why the agents run in place**: the runner resolves `src/` from the checkout it runs in, so an author in another worktree would test other files
    <!-- testing-policy:end -->
    POLICY_EOF
    cat > .claude/agents/unit-test-author.md <<'AGENT_EOF'
    ---
    name: unit-test-author
    description: Authors and runs one unit test, a new test file or a new test case, after a mandatory reuse audit. Dispatch it for every new unit test; it never writes production code.
    tools: Read, Write, Edit, Bash, Grep, Glob
    ---
    <!-- testing-policy:agent v=2.3 -->

    Write one failing unit test for the behaviour in the dispatch input, as `src/<module>.test.js`
    with `node:test` and `node:assert`, run it once with `node --test <file>`, and return
    `RED_AS_EXPECTED` with the run's output, or `GREEN` when it passes before any implementation.
    Never write production code.
    AGENT_EOF
    cat > .claude/skills/do-code-review/SKILL.md <<'REVIEW_SKILL_EOF'
    ---
    name: do-code-review
    description: Reviews the diff of a branch since a fixed point on six Axes, fixes its Act on Findings through its Fixer and lands the branch on the developer's branch when the Review is Green. Use when do hands over a Ticket or a Spec at its review step, or when the user asks to review a branch.
    ---
    This fixture's stand-in for `do-code-review`: the real skill's call and return, with a Green
    Review. From the reviewed branch's worktree, run

        bash .claude/skills/do-code-review/review.sh $ARGUMENTS

    and return its whole output verbatim as the report. Edit nothing and commit nothing yourself, and
    pass the arguments through exactly as they were given.
    REVIEW_SKILL_EOF
    cat > .claude/skills/do-code-review/review.sh <<'REVIEW_SH_EOF'
    #!/usr/bin/env bash
    # Stand-in for do-code-review in this fixture: the real skill's call and return for a Spec
    # handed over at a Final integration, always Green. Arguments: <spec> <fixed point>
    # <landing target>, then the lines do sends after them; a `Review file: <path>` line among them
    # is where the Review is written, and without one it is written beside the Spec under the
    # Spec's own name. Lands by fast-forward and prints the return the caller reads. Every call is
    # logged under the repository's .git for the graders, and so is every claim file found beside
    # the Spec when the call came, since the release deletes the claim before the run ends.
    set -euo pipefail
    common="$(cd "$(git rev-parse --git-common-dir)" && pwd)"
    printf '%s\n' "$*" >> "$common/do-code-review-calls.log"
    for a in "$@"; do
      case "$a" in fix|--no-fix) echo "stand-in: refused the argument $a, which this run never passes"; exit 2;; esac
    done
    spec="${1:?the Spec location}"
    fixed="${2:?the fixed point}"
    target="${3:?the landing target}"
    [ -f "$spec" ] || { echo "$spec is not a Spec file; nothing reviewed"; exit 1; }
    for claim in "$(dirname "$spec")"/*.integration.claim; do
      [ -f "$claim" ] && printf 'held at the review: %s\n' "$(basename "$claim")" >> "$common/claims-at-review.log"
    done
    review="$(printf '%s\n' "$*" | sed -n 's/.*Review file: *\([^ `"]*\).*/\1/p' | head -1)"
    [ -n "$review" ] || review="${spec%.md}.review.md"
    main="$(git worktree list --porcelain | sed -n '1s/^worktree //p')"
    branch="$(git branch --show-current)"
    git rev-parse --verify -q "$fixed^{commit}" >/dev/null || { echo "$fixed does not resolve; nothing reviewed"; exit 1; }
    [ -n "$(git diff --stat "$fixed" HEAD)" ] || { echo "no diff between $fixed and the working tree; nothing reviewed"; exit 1; }
    if node --test >/dev/null 2>&1; then suite_line='`node --test`: green'; green=1; else suite_line='`node --test`: red'; green=0; fi
    if [ "$green" = 1 ] && git -C "$main" merge --ff-only -q "$branch" >/dev/null 2>&1; then
      landing="landed at $(git rev-parse --short "$branch")"
    else
      landing="not landed: the fast-forward of $target to $branch failed or the suite is red; the branch and its worktree stay in place"
    fi
    cat > "$review" <<EOF
    # Review: $(basename "$(dirname "$spec")")

    Spec: $spec
    Fixed point: $fixed
    Commit: $(git rev-parse --short HEAD)
    Landing target: $target
    Branch: $branch

    ## Intent

    Hold the Invoice of a disputed Order.

    ## Safety fact

    The unit suite covers every exported function the diff touches, run in the worktree (Rung 4).

    ## Findings

    ### Act on

    none

    ### Consider

    none

    ### Noted

    none

    ### Cleared

    none

    ## Axes

    - Correctness: 0 findings
    - Spec: 0 findings
    - Standards: 0 findings
    - Principles: 0 findings
    - Blast radius: 0 findings
    - Security: 0 findings

    ## Fix run

    Date: $(date +%F) · at $(git rev-parse --short HEAD)

    - no Act on Finding: no Fixer forked, nothing to fix
    - suite: $suite_line
    - $landing
    EOF
    echo "Review: $review"
    cat "$review"
    echo
    echo "Act on: none"
    echo "Landing: $landing"
    REVIEW_SH_EOF
    chmod +x .claude/skills/do-code-review/review.sh
    cat > src/invoice.js <<'JS'
    const invoices = new Map();
    function open(orderId) { invoices.set(orderId, { orderId, status: "open" }); return invoices.get(orderId); }
    function lookup(orderId) { return invoices.get(orderId); }
    module.exports = { open, lookup };
    JS
    cat > src/invoice.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert");
    const { open, lookup } = require("./invoice.js");

    test("an opened Invoice reads open", () => {
      open("order-1");
      assert.equal(lookup("order-1").status, "open");
    });
    JS

    cat > ../ledger-service/package.json <<'JSON'
    {
      "name": "ledger-service",
      "private": true,
      "scripts": {
        "test": "node --test"
      }
    }
    JSON
    cat > ../ledger-service/README.md <<'MD'
    # ledger-service

    Keeps the ledger of what happened to each Order's money. `node --test` runs the suite.
    MD
    cat > ../ledger-service/src/ledger.js <<'JS'
    const entries = [];
    function record(orderId, kind) { entries.push({ orderId, kind }); return entries.length; }
    function entriesOf(orderId) { return entries.filter((entry) => entry.orderId === orderId); }
    module.exports = { record, entriesOf };
    JS

    cat > ../orders-service/package.json <<'JSON'
    {
      "name": "orders-service",
      "private": true,
      "scripts": {
        "test": "node --test"
      }
    }
    JSON
    cat > ../orders-service/README.md <<'MD'
    # orders-service

    Records Orders and their status, and shows each Order's page. `node --test` runs the suite.
    MD
    cat > ../orders-service/src/order.js <<'JS'
    const orders = new Map();
    function record(id) { orders.set(id, { id, status: "open" }); return orders.get(id); }
    function dispute(id) { orders.get(id).status = "disputed"; return orders.get(id); }
    function lookup(id) { return orders.get(id); }
    module.exports = { record, dispute, lookup };
    JS
    cat > ../orders-service/src/page.js <<'JS'
    const { lookup } = require("./order.js");
    function page(id) {
      const order = lookup(id);
      return `Order ${order.id}: ${order.status}`;
    }
    module.exports = { page };
    JS

    home="$(pwd -P)"
    ledger="$(cd ../ledger-service && pwd -P)"
    orders="$(cd ../orders-service && pwd -P)"
    cat > .scratch/hold-disputed-invoice/spec.md <<MD
    # Hold the Invoice of a disputed Order

    Journey: ./journey.md
    Status: ready-for-agent

    ## Problem Statement

    A customer disputes an Order and the billing service keeps chasing its open Invoice.

    ## Solution

    A support agent puts the Invoice of a disputed Order on hold, the ledger keeps an entry of the hold, and the Order's page shows it.

    ## Repositories

    - billing-service (Home repository): $home
    - ledger-service: $ledger
    - orders-service: $orders

    ## User Stories

    1. As an accountant, I want the ledger to keep an entry of every hold, so that a held Invoice is never read as unpaid by mistake
    2. As a support agent, I want to put the Invoice of a disputed Order on hold, so that the customer is not chased while the dispute is open
    3. As a support agent, I want the Order's page to show that its Invoice is held, so that I can tell the customer nothing is due

    ## Implementation Decisions

    - The ledger keeps a hold as an entry of kind hold, beside the entries it already records
    - An Invoice carries a status, open or held; a hold never deletes the Invoice
    - The hold is a function of the invoice module, beside open and lookup
    - The Order's page reads the Invoice it is handed and never the billing service's store

    ## Testing Decisions

    - Behaviour tests through each module's exported functions, with Node's own test runner

    ## Out of Scope

    - Releasing a held Invoice
    MD

    cat > .scratch/hold-disputed-invoice/journey.md <<'MD'
    # Journey: Hold the Invoice of a disputed Order

    Spec: ./spec.md
    Actor: support agent
    Entry: the Order's page

    ## Path 1: Keep the hold in the ledger

    Story: 1
    Outcome: the ledger carries an entry of the hold.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the ledger of an Order whose Invoice was put on hold | nothing | the ledger lists an entry of kind hold |

    Failure branches:
    - none

    ## Path 2: Hold the Invoice

    Story: 2
    Outcome: the Invoice of the disputed Order reads held.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the Invoice of a disputed Order, with a Hold action | picks Hold | the Invoice's status reads held |

    Failure branches:
    - none

    ## Path 3: See the hold on the Order's page

    Story: 3
    Outcome: the Order's page reads that its Invoice is held.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the page of a disputed Order whose Invoice was put on hold | nothing | the page shows the Invoice as held |

    Failure branches:
    - none

    ## States

    | State | The actor sees | Actions |
    |---|---|---|
    | open | the Invoice as open | Hold |
    | held | the Invoice as held | none |

    ## Cut

    - none

    ## Defaults taken

    - none

    ## Deferred

    - none

    ## Spec changes applied

    - none

    ## Reopen in discuss

    - none
    MD

    cat > .scratch/hold-disputed-invoice/issues/01-keep-the-hold-in-the-ledger.md <<'MD'
    # 01: Keep the hold in the ledger

    **What to build:** The ledger keeps an entry of kind hold for an Order whose Invoice was put on hold.

    **Blocked by:** None (can start immediately)

    **Status:** resolved

    **Build repository:** ledger-service

    - [x] Holding an Order records an entry of kind hold that the Order's entries list

    ## Evidence

    - Landed on `spec/hold-disputed-invoice` in ledger-service.
    MD

    cat > .scratch/hold-disputed-invoice/issues/02-hold-the-invoice-of-a-disputed-order.md <<'MD'
    # 02: Hold the Invoice of a disputed Order

    **What to build:** A support agent puts the Invoice of a disputed Order on hold.

    **Blocked by:** 01 Keep the hold in the ledger

    **Status:** resolved

    **Build repository:** billing-service

    - [x] Hold on an Order's open Invoice sets the Invoice's status to held

    ## Evidence

    - Landed on `spec/hold-disputed-invoice` in billing-service.
    MD

    cat > .scratch/hold-disputed-invoice/issues/03-show-the-hold-on-the-order-page.md <<'MD'
    # 03: Show the hold on the Order's page

    **What to build:** The Order's page shows that the Invoice of a disputed Order is held.

    **Blocked by:** 02 Hold the Invoice of a disputed Order

    **Status:** resolved

    **Build repository:** orders-service

    - [x] The page of a disputed Order handed a held Invoice shows the Invoice as held

    ## Evidence

    - Landed on `spec/hold-disputed-invoice` in orders-service.
    MD

    printf '.scratch/\n' > .gitignore
    # Fixed dates, a fixed identity and no signature: the commits of a repository whose files this
    # script writes whole hash the same on every run, which is what lets a grader hold the main of
    # orders-service to the commit it was left at.
    commit() {
      GIT_AUTHOR_DATE='2026-01-05T09:00:00Z' GIT_COMMITTER_DATE='2026-01-05T09:00:00Z' \
        git -C "$1" -c user.email=fixture@example.com -c user.name=fixture -c commit.gpgsign=false commit -q -m "$2"
    }
    git init -q -b main
    git add -A
    commit . "fixture"
    # Ticket 02's work, on the Spec branch of billing-service and not on main yet.
    git checkout -q -b spec/hold-disputed-invoice
    cat > src/invoice.js <<'JS'
    const invoices = new Map();
    function open(orderId) { invoices.set(orderId, { orderId, status: "open" }); return invoices.get(orderId); }
    function lookup(orderId) { return invoices.get(orderId); }
    function hold(orderId) {
      const invoice = invoices.get(orderId);
      if (!invoice) return { held: false, reason: "no Invoice is open" };
      invoice.status = "held";
      return { held: true };
    }
    module.exports = { open, lookup, hold };
    JS
    cat >> src/invoice.test.js <<'JS'

    test("a held Invoice reads held", () => {
      const { hold } = require("./invoice.js");
      open("order-2");
      hold("order-2");
      assert.equal(lookup("order-2").status, "held");
    });
    JS
    git add -A
    commit . "feat(invoice): hold the Invoice of a disputed Order"
    git branch -q --set-upstream-to=main spec/hold-disputed-invoice
    git checkout -q main

    # ledger-service already landed: Ticket 01's work went from its Spec branch to its main by
    # fast-forward, and the Spec branch was removed.
    git -C ../ledger-service init -q -b main
    git -C ../ledger-service add -A
    commit ../ledger-service "fixture"
    git -C ../ledger-service checkout -q -b spec/hold-disputed-invoice
    cat > ../ledger-service/src/ledger.js <<'JS'
    const entries = [];
    function record(orderId, kind) { entries.push({ orderId, kind }); return entries.length; }
    function entriesOf(orderId) { return entries.filter((entry) => entry.orderId === orderId); }
    function hold(orderId) { return record(orderId, "hold"); }
    module.exports = { record, entriesOf, hold };
    JS
    git -C ../ledger-service add -A
    commit ../ledger-service "feat(ledger): keep the hold of an Invoice as an entry"
    git -C ../ledger-service checkout -q main
    git -C ../ledger-service merge -q --ff-only spec/hold-disputed-invoice
    git -C ../ledger-service branch -q -d spec/hold-disputed-invoice

    git -C ../orders-service init -q -b main
    git -C ../orders-service add -A
    commit ../orders-service "fixture"
    # Ticket 03's work, on the Spec branch of orders-service and not on main yet.
    git -C ../orders-service checkout -q -b spec/hold-disputed-invoice
    cat > ../orders-service/src/page.js <<'JS'
    const { lookup } = require("./order.js");
    function page(id, invoice) {
      const order = lookup(id);
      const held = invoice && invoice.status === "held" ? ", Invoice held" : "";
      return `Order ${order.id}: ${order.status}${held}`;
    }
    module.exports = { page };
    JS
    git -C ../orders-service add -A
    commit ../orders-service "feat(page): show the hold on the Order's page"
    git -C ../orders-service branch -q --set-upstream-to=main spec/hold-disputed-invoice
    git -C ../orders-service checkout -q main
