    # Archive notes

    Journey: ./journey.md
    Status: ready-for-agent

    ## Problem Statement

    Notes pile up in the list and there is no way to put one aside without deleting it.

    ## Solution

    A note can be archived. Archived notes leave the list and can be restored from an Archived view.

    ## User Stories

    1. As a writer, I want to archive a note, so that it leaves my list without being deleted
    2. As a writer, I want to see my archived notes, so that I can find one I put aside
    3. As a writer, I want to restore an archived note, so that it returns to my list

    ## Implementation Decisions

    - A note carries a status, active or archived; archiving never deletes
    - The list shows active notes only; a separate Archived view shows the rest
    - Archiving is one way: a second Archive on the same note is a no-op, and Restore is its own action

    ## Testing Decisions

    - Behaviour tests through the notes module's exported functions, with Node's own test runner

    ## Out of Scope

    - Deleting archived notes permanently
    MD

