    ```

    **Flow root & naming**: `e2e/<journey>.flow.test.ts`, one file per journey (`e2e/list-notes.flow.test.ts`)

    **Shared homes by role** (canonical, one path per role; "none yet → create at X" is a valid entry)
    - Page objects / interactions (or shared subflows): `e2e/helpers/ (the CLI driver `cli.mjs`, `runCli(lines)`)`
    - Data factories (entity builders): `none yet → create at e2e/factories/`
    - Backend / DB helpers (fixture state, direct assertions): `none: the CLI is the whole stack, and a flow reads the outcome back through `list``
    - Fixtures (session, context, cleanup): `none yet → create at e2e/fixtures/`

    **Discovery: run all of these on every dispatch, before writing**
    ```
    grep -rhoE '^(export )?(async )?function [A-Za-z_]+' e2e --include='*.ts' --include='*.mjs' | sort | uniq -d
    grep -rnE '^export (async )?function' e2e/helpers || true
    ls e2e e2e/helpers
    ```

    **Idiom** (calibration only, never a catalog)
    English identifiers; `node:test` with `node:assert/strict`; a flow calls `runCli([...])` from `./helpers/cli.mjs` and asserts on `status` and on `stdout` split into lines, as `e2e/list-notes.flow.test.ts` does with `runCli(["create first", "create second", "list"])`; the outcome the writer sees is the CLI's output, never the module's state
    AGENT_EOF
    cat > bin/notes.mjs <<'JS'
    import { createInterface } from "node:readline";
    import { create, list } from "../src/notes.ts";

    const lines = createInterface({ input: process.stdin });
    for await (const line of lines) {
      const [command, ...rest] = line.trim().split(" ");
      const title = rest.join(" ");
      if (command === "") continue;
      if (command === "create") {
        const note = create(title);
        console.log(`created ${note.id} ${note.title}`);
      } else if (command === "list") {
        const active = list();
        if (active.length === 0) console.log("(empty)");
        for (const note of active) console.log(`${note.id} ${note.title}`);
      } else {
        console.log(`unknown command: ${command}`);
      }
    }
    JS

    cat > e2e/helpers/cli.mjs <<'JS'
    import { spawnSync } from "node:child_process";
    import { fileURLToPath } from "node:url";

    const bin = fileURLToPath(new URL("../../bin/notes.mjs", import.meta.url));

    export function runCli(lines) {
      const run = spawnSync(process.execPath, [bin], { input: lines.join("\n") + "\n", encoding: "utf8" });
      return { status: run.status, stdout: run.stdout, stderr: run.stderr };
    }
    JS

    cat > e2e/list-notes.flow.test.ts <<'TS'
    import { test } from "node:test";
    import assert from "node:assert/strict";
    import { runCli } from "./helpers/cli.mjs";

    test("the list shows every created note, one per line", () => {
      const run = runCli(["create first", "create second", "list"]);
      assert.equal(run.status, 0, run.stderr);
      assert.deepEqual(run.stdout.trim().split("\n"), ["created 1 first", "created 2 second", "1 first", "2 second"]);
    });
    TS
