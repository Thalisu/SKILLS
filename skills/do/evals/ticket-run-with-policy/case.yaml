    **Tool & run commands**
    - Single flow: `node --test <file>`
    - Full suite (delivery gate, not yours to run): `node --test e2e/`
    - Formatter / linter: `none`
    - Run from the checkout root: the flow spawns `node bin/notes.mjs` from the checkout it runs in and feeds it one command per stdin line (`create <title>`, `list`); the process keeps its notes in memory, so one flow is one process. No device, no server, no base URL

    **Preflight: every check must pass before running**
