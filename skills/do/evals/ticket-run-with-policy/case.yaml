    **Framework & run commands**
    - Single file: `node --test <file>`
    - Full suite: `node --test src/`
    - Formatter: `none`
    - Node's own runner strips the types: a test file imports the module with its `.ts` extension (`./notes.ts`) and asserts with `node:assert/strict`; no preload, no flags

    **Test root & layout**: colocated, `src/<module>.test.ts` beside `src/<module>.ts` (`src/notes.test.ts` beside `src/notes.ts`)

    **Shared homes by role** (canonical, one path per role; "none yet → create at X" is a valid entry)
    - Module mocks: `none yet → create at src/test/mocks/`
    - Helpers / wrappers: `none yet → create at src/test/helpers/`
    - Factories (data builders): `none yet → create at src/test/factories/`
    - Fixtures (static inputs): `none yet → create at src/test/fixtures/`

    **System boundaries** (the only things a unit test mocks; one line per boundary, what it is → the shared mock that replaces it; "none: pure modules" is a valid entry)
    none: pure modules

    **Discovery: run all of these on every dispatch, before writing**
    ```
    grep -rhoE '^(export )?(async )?function [A-Za-z_]+' src --include='*.test.ts' | sort | uniq -d
    grep -rnE '^(function|const) (make|build|create)[A-Z]' src --include='*.test.ts' || true
    ls src/test 2>/dev/null || true
    ```

    **Idiom** (calibration only, never a catalog)
    English identifiers; `node:test` with `node:assert/strict`; a test is named for the behaviour in the caller's words, as `test("a created note is listed", ...)` in `src/notes.test.ts`; no shared assets yet, so there is nothing to reuse until a second test needs the same builder
