name: pr-stop-case-beside-a-not-reproduced-check-reruns-before-the-stop
tags: [pr, watch, fix, rerun, stop]
runs: 2
max_turns: 120
timeout_seconds: 3600
allowed_tools: [Bash, Read, Edit, Write, Agent]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A pull request whose head `add-banner` has two red checks in two workflow runs. `banner`, on
    # run 7, fails because tests/banner.sh pins the sha256 of src/banner.txt to the digest of a
    # release text the scaffold drew at random and then dropped, so no edit of the code turns it
    # green and its fixer can only report it cannot fix it. `e2e`, on run 8, is red in CI on its
    # first attempt only: its log reads a database the runner could not reach, while tests/e2e.sh
    # passes locally, so its fixer returns `not reproduced`. A fake gh, first on the session's PATH
    # through the project's settings, runs tests/banner.sh at the bare remote's head for `banner`,
    # and reports `e2e` failed while run 8's attempt in .fake/attempt is 1 and passed once
    # `gh run rerun 8 --failed` has raised it. The developer has the head checked out with an
    # untracked note of their own, the remote is a bare repository under .fake/, and every gh call
    # is logged in .fake/gh.log.
    set -e
    mkdir -p src tests .github/workflows .fake/bin .claude
    printf '# notes\n' > README.md
    printf '.fake/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git checkout -q -b add-banner
    printf 'notes, version 2\n' > src/banner.txt
    want="$(head -c 48 /dev/urandom | sha256sum | cut -d' ' -f1)"
    cat > tests/banner.sh <<SH
    #!/usr/bin/env bash
    got="\$(sha256sum "\$(dirname "\$0")/../src/banner.txt" | cut -d' ' -f1)"
    [ "\$got" = $want ] || { echo "FAIL src/banner.txt: sha256 \$got, want $want, the digest the release signed"; exit 1; }
    echo "ok    src/banner.txt matches the signed release"
    SH
    cat > src/greet.sh <<'SH'
    #!/usr/bin/env bash
    printf 'hello, %s\n' "$1"
    SH
    cat > tests/e2e.sh <<'SH'
    #!/usr/bin/env bash
    got="$(bash "$(dirname "$0")/../src/greet.sh" ana)"
    [ "$got" = "hello, ana" ] || { echo "FAIL greet: got '$got', want 'hello, ana'"; exit 1; }
    echo "ok    greet says hello"
    SH
    cat > .github/workflows/ci.yml <<'YML'
    name: ci
    on: pull_request
    jobs:
      banner:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Run tests
            run: bash tests/banner.sh
    YML
    cat > .github/workflows/e2e.yml <<'YML'
    name: e2e
    on: pull_request
    jobs:
      e2e:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Run tests
            run: bash tests/e2e.sh
    YML
    printf 'add-banner\n' > .fake/branch
    printf '1\n' > .fake/attempt
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "open the pull request"
    git clone -q --bare . .fake/remote.git
    git remote add origin "$PWD/.fake/remote.git"
    git fetch -q origin
    git branch -q -u origin/add-banner
    git rev-parse HEAD > .fake/red.sha
    printf 'wip: ask release for the signed banner text\n' > NOTES.md
    cat > .fake/bin/gh <<'SH'
    #!/usr/bin/env bash
    printf '%s\t%s\n' "$*" "$(ps -o args= -p "$PPID" 2>/dev/null)" >> "$GH_FAKE/gh.log"
    expr=
    for ((i = 1; i <= $#; i++)); do
      [ "${!i}" = --jq ] && { j=$((i + 1)); expr="${!j}"; }
    done
    answer() { if [ -n "$expr" ]; then jq -r "$expr"; else cat; fi; }
    remote="$GH_FAKE/remote.git"
    branch="$(cat "$GH_FAKE/branch")"
    head="$(git --git-dir="$remote" rev-parse "refs/heads/$branch")"
    attempt="$(cat "$GH_FAKE/attempt")"
    banner_out() {
      local d out rc
      d="$(mktemp -d)"
      git --git-dir="$remote" archive "$head" | tar -x -C "$d"
      out="$(cd "$d" && bash tests/banner.sh 2>&1)" && rc=0 || rc=$?
      rm -rf "$d"
      printf '%s\n' "$out"
      return "$rc"
    }
    if banner_out >/dev/null; then banner=pass; else banner=fail; fi
    if [ "$attempt" -ge 2 ]; then e2e=pass; else e2e=fail; fi
    merge=CLEAN
    [ "$banner" = pass ] && [ "$e2e" = pass ] || merge=UNSTABLE
    case "$1 $2" in
      "auth status") echo "Logged in to github.com account fixture"; exit 0 ;;
      "pr view")
        printf '{"number":42,"headRefName":"%s","baseRefName":"main","state":"OPEN","mergeStateStatus":"%s","mergeable":"MERGEABLE","headRefOid":"%s"}\n' \
          "$branch" "$merge" "$head" | answer ;;
      "pr checks")
        printf '[{"name":"banner","bucket":"%s","link":"https://github.com/acme/notes/actions/runs/7/job/101"},{"name":"e2e","bucket":"%s","link":"https://github.com/acme/notes/actions/runs/8/job/201"}]\n' \
          "$banner" "$e2e" | answer ;;
      "run view")
        if [ "$*" = "run view 8 --repo github.com/acme/notes --json attempt --jq .attempt" ]; then
          printf '{"attempt":%s}\n' "$attempt" | answer
        elif [ "$*" = "run view --job 101 --repo github.com/acme/notes --log-failed" ] && [ "$banner" = fail ]; then
          out="$(banner_out)" || true
          printf 'banner\tRun tests\t2026-10-14T12:00:01.1000000Z ##[group]Run bash tests/banner.sh\n'
          while IFS= read -r line; do
            printf 'banner\tRun tests\t2026-10-14T12:00:01.2000000Z %s\n' "$line"
          done <<< "$out"
          printf 'banner\tRun tests\t2026-10-14T12:00:01.3000000Z /home/runner/work/notes/notes/tests/banner.sh exited 1\n'
          printf 'banner\tRun tests\t2026-10-14T12:00:01.4000000Z ##[error]Process completed with exit code 1.\n'
        elif [ "$*" = "run view --job 201 --repo github.com/acme/notes --log-failed" ] && [ "$e2e" = fail ]; then
          printf 'e2e\tRun tests\t2026-10-14T12:00:01.1000000Z ##[group]Run bash tests/e2e.sh\n'
          printf 'e2e\tRun tests\t2026-10-14T12:00:01.2000000Z curl: (7) Failed to connect to 10.1.0.4 port 5432: Connection refused (service container not ready)\n'
          printf 'e2e\tRun tests\t2026-10-14T12:00:01.3000000Z /home/runner/work/notes/notes/tests/e2e.sh exited 1\n'
          printf 'e2e\tRun tests\t2026-10-14T12:00:01.4000000Z ##[error]Process completed with exit code 1.\n'
        else
          echo "fake gh: no answer recorded for: $*" >&2
          exit 1
        fi ;;
      "run rerun")
        [ "$*" = "run rerun 8 --repo github.com/acme/notes --failed" ] || {
          echo "fake gh: no answer recorded for: $*" >&2
          exit 1
        }
        printf '%s\n' "$((attempt + 1))" > "$GH_FAKE/attempt" ;;
      *) echo "fake gh: no answer recorded for: $*" >&2; exit 1 ;;
    esac
    SH
    chmod +x .fake/bin/gh
    printf '{"env": {"PATH": "%s/.fake/bin:%s", "GH_FAKE": "%s/.fake", "DO_PR_WATCH_SECONDS": "5", "DO_PR_WATCH_INTERVAL": "1", "DO_PR_RERUN_SECONDS": "5"}}\n' \
      "$PWD" "$PATH" "$PWD" > .claude/settings.json
    printf '.claude/\n' >> .git/info/exclude
