name: pr-pushed-fix-red-again-stops-with-no-next-round
tags: [pr, watch, fix]
runs: 2
max_turns: 120
timeout_seconds: 3600
allowed_tools: [Bash, Read, Edit, Write, Agent]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A pull request whose head `add-greet` has its `greet` check red on a planted defect: `greet`
    # drops the space after the comma, so `bash tests/greet.sh` fails locally as its log says and a
    # fix of src/greet.sh turns it green. CI keeps `greet` red whatever the head holds: the fake gh
    # lists it in .fake/red-in-ci and answers its log with the test's output at the commit the pull
    # request was opened on. So the fixer's fix is pushed, and the watch after the push reads the
    # same check red again. The fake gh, first on the session's PATH through the project's
    # settings, runs every other check's test at the bare remote's head. The developer has the head
    # checked out with an untracked note of their own, the remote is a bare repository under
    # .fake/, and every gh call is logged in .fake/gh.log.
    set -e
    mkdir -p src tests .github/workflows .fake/bin .claude
    printf '# notes\n' > README.md
    printf '.fake/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git checkout -q -b add-greet
    cat > src/greet.sh <<'SH'
    greet() {
      echo "Hello,$1"
    }
    SH
    cat > tests/greet.sh <<'SH'
    #!/usr/bin/env bash
    . "$(dirname "$0")/../src/greet.sh"
    got="$(greet Ada)"
    [ "$got" = "Hello, Ada" ] || { echo "FAIL greet Ada (src/greet.sh): got '$got', want 'Hello, Ada'"; exit 1; }
    echo "ok    greet Ada"
    SH
    cat > .github/workflows/ci.yml <<'YML'
    name: ci
    on: pull_request
    jobs:
      greet:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Run tests
            run: bash tests/greet.sh
    YML
    printf 'add-greet\n' > .fake/branch
    printf 'greet\n' > .fake/checks
    printf 'greet\n' > .fake/red-in-ci
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "open the pull request"
    git clone -q --bare . .fake/remote.git
    git remote add origin "$PWD/.fake/remote.git"
    git fetch -q origin
    git branch -q -u origin/add-greet
    git rev-parse HEAD > .fake/red.sha
    printf 'wip: ask whether greet should take a title\n' > NOTES.md
    cat > .fake/bin/gh <<'SH'
    #!/usr/bin/env bash
    printf '%s\t%s\n' "$*" "$(ps -o args= -p "$PPID" 2>/dev/null)" >> "$GH_FAKE/gh.log"
    expr=
    for ((i = 1; i <= $#; i++)); do
      [ "${!i}" = --jq ] && { j=$((i + 1)); expr="${!j}"; }
    done
    answer() { if [ -n "$expr" ]; then jq -r "$expr"; else cat; fi; }
    remote="$GH_FAKE/remote.git"
    branch="$(cat "$GH_FAKE/branch")"
    mapfile -t fns < "$GH_FAKE/checks"
    head="$(git --git-dir="$remote" rev-parse "refs/heads/$branch")"
    red="$(cat "$GH_FAKE/red.sha")"
    test_at() {
      local d out rc
      d="$(mktemp -d)"
      git --git-dir="$remote" archive "$1" | tar -x -C "$d"
      out="$(cd "$d" && bash "tests/$2.sh" 2>&1)" && rc=0 || rc=$?
      rm -rf "$d"
      printf '%s\n' "$out"
      return "$rc"
    }
    # A check listed in .fake/red-in-ci fails in CI whatever the head holds, its log the one its
    # test printed at the commit the pull request was opened on.
    run_test() {
      if grep -qx "$1" "$GH_FAKE/red-in-ci"; then
        test_at "$red" "$1"
        return 1
      fi
      test_at "$head" "$1"
    }
    case "$1 $2" in
      "auth status") echo "Logged in to github.com account fixture"; exit 0 ;;
      "pr view")
        merge=CLEAN
        for fn in "${fns[@]}"; do run_test "$fn" >/dev/null || merge=UNSTABLE; done
        printf '{"number":42,"headRefName":"%s","baseRefName":"main","state":"OPEN","mergeStateStatus":"%s","mergeable":"MERGEABLE","headRefOid":"%s"}\n' \
          "$branch" "$merge" "$head" | answer ;;
      "pr checks")
        rows=
        for i in "${!fns[@]}"; do
          fn="${fns[$i]}"
          if run_test "$fn" >/dev/null; then b=pass; else b=fail; fi
          rows="$rows${rows:+,}{\"name\":\"$fn\",\"bucket\":\"$b\",\"link\":\"https://github.com/acme/notes/actions/runs/7/job/$((101 + i))\"}"
        done
        printf '[%s]\n' "$rows" | answer ;;
      "run view")
        job="$4"
        [ "$*" = "run view --job $job --repo github.com/acme/notes --log-failed" ] || {
          echo "fake gh: no answer recorded for: $*" >&2
          exit 1
        }
        i=$((job - 101))
        fn="${fns[$i]:-}"
        [ "$i" -ge 0 ] && [ -n "$fn" ] || { echo "fake gh: no job $job" >&2; exit 1; }
        out="$(run_test "$fn")" && { echo "fake gh: job $job did not fail" >&2; exit 1; }
        printf '%s\tRun tests\t2026-10-14T12:00:01.1000000Z ##[group]Run bash tests/%s.sh\n' "$fn" "$fn"
        while IFS= read -r line; do
          printf '%s\tRun tests\t2026-10-14T12:00:01.2000000Z %s\n' "$fn" "$line"
        done <<< "$out"
        printf '%s\tRun tests\t2026-10-14T12:00:01.3000000Z /home/runner/work/notes/notes/tests/%s.sh exited 1\n' "$fn" "$fn"
        printf '%s\tRun tests\t2026-10-14T12:00:01.4000000Z ##[error]Process completed with exit code 1.\n' "$fn" ;;
      *) echo "fake gh: no answer recorded for: $*" >&2; exit 1 ;;
    esac
    SH
    chmod +x .fake/bin/gh
    printf '{"env": {"PATH": "%s/.fake/bin:%s", "GH_FAKE": "%s/.fake", "DO_PR_WATCH_SECONDS": "5", "DO_PR_WATCH_INTERVAL": "1"}}\n' \
      "$PWD" "$PATH" "$PWD" > .claude/settings.json
    printf '.claude/\n' >> .git/info/exclude
