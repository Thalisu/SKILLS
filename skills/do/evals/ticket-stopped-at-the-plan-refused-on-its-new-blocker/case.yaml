name: ticket-stopped-at-the-plan-refused-on-its-new-blocker
tags: [playbook, ticket, stop, resume]
runs: 2
max_turns: 12
timeout_seconds: 300
allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Agent, Skill]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # Ticket 01 was stopped at the Plan on work that belonged elsewhere, before the claim: it still
    # reads ready-for-agent, no worktree and no do/ branch was ever cut, and the Plan of that run
    # sits beside it. `tickets` has since moved one criterion to a new Ticket 02 and written it on
    # Ticket 01's Blocked by line. Ticket 02 still reads ready-for-agent, so the run is refused, and
    # the refusal names no claim, no worktree and no commits, since Ticket 01 has none.
    set -e
    mkdir -p src .scratch/archive-notes/issues
    cat > README.md <<'MD'
    # notes

    A small notes module: create a note, list the active ones.
    MD
    cat > src/notes.js <<'JS'
    const notes = [];
    function create(title) { const note = { id: notes.length + 1, title, status: "active" }; notes.push(note); return note; }
    function list() { return notes.filter((n) => n.status === "active"); }
    module.exports = { create, list };
    JS

    cat > .scratch/archive-notes/spec.md <<'MD'
    # Archive notes

    Journey: not needed, two short paths with no branching
    Status: ready-for-agent

    ## Problem Statement

    Notes pile up in the list and there is no way to put one aside without deleting it.

    ## Solution

    A note can be archived. Archived notes leave the list, and a count says how many there are.

    ## User Stories

    1. As a writer, I want to archive a note, so that it leaves my list without being deleted
    2. As a writer, I want to see how many notes I archived, so that I know they were kept
    MD

    cat > .scratch/archive-notes/issues/01-archive-a-note.md <<'MD'
    # 01: Archive a note

    **What to build:** Archive a note: the note leaves the list.

    **Blocked by:** 02 Count the archived notes

    **Status:** ready-for-agent

    - [ ] Picking Archive on a note removes it from the list
    - [ ] Archive picked twice on the same note is a no-op: the note stays out of the list

    ## Evidence
    MD

    # The Plan the stopped run left, cut from the criteria Ticket 01 held before `tickets` moved
    # the count to Ticket 02.
    cat > .scratch/archive-notes/issues/01-archive-a-note.plan.md <<'MD'
    ## Sources

    ticket: .scratch/archive-notes/issues/01-archive-a-note.md 1f0e5c2a9b7d4e6f8a1b3c5d7e9f0a2b4c6d8e0f
    digest: .scratch/archive-notes/issues/01-archive-a-note.digest.md 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b

    ## Behaviours

    1. Behavior to prove: picking Archive on a note removes it from the list
       Target: `src/notes.js`
       Origin: new feature
    2. Behavior to prove: Archive picked twice on the same note is a no-op
       Target: `src/notes.js`
       Origin: new feature
    3. Elsewhere: after archiving one note, the Archived count reads one. Belongs to: the counter, which this repository does not hold

    ## Sketch

    none: no boundary crossed
    MD

    cat > .scratch/archive-notes/issues/02-count-the-archived-notes.md <<'MD'
    # 02: Count the archived notes

    **What to build:** Count the archived notes: after a note is archived, the Archived count reads one more.

    **Blocked by:** None (can start immediately)

    **Status:** ready-for-agent

    - [ ] After archiving one note, the Archived count reads one

    ## Evidence
    MD

    printf '.scratch/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
