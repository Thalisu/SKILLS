name: runnable-fork
tags: [workflow, prototype]
runs: 2
max_turns: 16
timeout_seconds: 600
allowed_tools: [Bash, Read, Edit, Write, Agent]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A scorecard with six months side by side has no precedent anywhere in the app, which only has lists:
    # what it looks like is a fork only a screen can settle, next to forks words can settle.
    set -e
    mkdir -p docs/agents src
    cat > index.html <<'HTML'
    <!doctype html>
    <html><head><meta charset="utf-8"><title>Backoffice</title></head>
    <body>
    <header><nav><a href="index.html">Home</a> <a href="customers.html">Customers</a> <a href="orders.html">Orders</a></nav></header>
    <main><h1>Backoffice</h1><p>Pick a section above.</p></main>
    </body></html>
    HTML
    cat > customers.html <<'HTML'
    <!doctype html>
    <html><head><meta charset="utf-8"><title>Customers</title></head>
    <body>
    <header><nav><a href="index.html">Home</a> <a href="customers.html">Customers</a> <a href="orders.html">Orders</a></nav></header>
    <main>
      <h1>Customers</h1>
      <p id="status-line" hidden></p>
      <form id="filter"><label>Search <input name="q" placeholder="Name or email"></label></form>
      <button id="new-customer">New customer</button>
      <form id="create" hidden>
        <label>Name <input name="name" required></label>
        <label>Email <input name="email" type="email" required></label>
        <button type="submit">Save</button> <button type="button" id="cancel">Cancel</button>
      </form>
      <table id="list"><thead><tr><th>Name</th><th>Email</th><th></th></tr></thead><tbody></tbody></table>
      <p id="empty" hidden>No customers yet. Add the first one.</p>
      <dialog id="confirm-delete"><p>Delete this customer? This cannot be undone.</p><button id="confirm">Delete</button> <button id="keep">Keep</button></dialog>
    </main>
    <script src="app.js"></script></body></html>
    HTML
    cat > app.js <<'JS'
    const customers = [{ name: "Ada", email: "ada@example.com" }];
    const $ = (id) => document.getElementById(id);
    function render(q = "") {
      const rows = customers.filter((c) => (c.name + c.email).toLowerCase().includes(q.toLowerCase()));
      $("list").querySelector("tbody").innerHTML = rows
        .map((c, i) => `<tr><td>${c.name}</td><td>${c.email}</td><td><button data-delete="${i}">Delete</button></td></tr>`)
        .join("");
      $("empty").hidden = customers.length > 0;
      $("list").hidden = customers.length === 0;
    }
    function say(text) { const line = $("status-line"); line.textContent = text; line.hidden = false; }
    $("filter").addEventListener("input", (e) => render(e.target.value));
    $("new-customer").addEventListener("click", () => { $("create").hidden = false; $("create").name.focus(); });
    $("cancel").addEventListener("click", () => { $("create").hidden = true; });
    $("create").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      if (!form.reportValidity()) return;
      customers.push({ name: form.name.value, email: form.email.value });
      form.reset(); form.hidden = true; render(); say("Customer added");
    });
    $("list").addEventListener("click", (e) => {
      const i = e.target.dataset.delete; if (i === undefined) return;
      const dialog = $("confirm-delete"); dialog.showModal();
      $("confirm").onclick = () => { customers.splice(Number(i), 1); dialog.close(); render(); say("Customer deleted"); };
      $("keep").onclick = () => dialog.close();
    });
    render();
    JS
    cat > docs/agents/issue-tracker.md <<'MD'
    # Issue tracker: Local Markdown

    Issues and specs for this repo live as markdown files in `.scratch/`.

    - One feature per directory: `.scratch/<feature-slug>/`
    - The spec is `.scratch/<feature-slug>/spec.md`
    - Implementation issues are one file per ticket at `.scratch/<feature-slug>/issues/<NN>-<slug>.md`, numbered from `01`
    - Triage state is a `Status:` line near the top of each issue file
    MD
    cat > CONTEXT.md <<'MD'
    # Backoffice

    The pages the purchasing and sales team use to keep customers and orders.

    ## Language

    **Customer**:
    A person or organisation that places orders.
    _Avoid_: client, account

    **Order**:
    A customer's request for goods, tracked from placement to fulfilment.
    _Avoid_: purchase
    MD
    mkdir -p .scratch/supplier-scorecard
    cat > .scratch/supplier-scorecard/spec.md <<'MD'
    # Supplier scorecard

    Journey: required
    Status: ready-for-agent

    ## Problem Statement

    Nobody can tell which suppliers deliver late until an order is already late.

    ## Solution

    A Scorecard page that shows, for every supplier, the share of deliveries that arrived on time in each of the last six months, side by side, worst supplier first.

    ## User Stories

    1. As a buyer, I want to see every supplier's on-time share for each of the last six months side by side, worst first, so that I can spot who is slipping
    2. As a buyer, I want to switch the period between the last three and the last six months, so that a recent slip is not hidden by a good year

    ## Implementation Decisions

    - On-time shares come from a static file, one row per supplier and month
    - The page is new, reached from the top navigation beside Customers and Orders
    - Worst first means the lowest on-time share over the chosen period

    ## Testing Decisions

    - Behaviour tests through the page

    ## Out of Scope

    - Drilling into one supplier's deliveries

    ## Further Notes

    none
    MD
