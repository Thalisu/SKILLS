name: auto-extreme-seams-ask-the-developer
tags: [workflow, auto, seams, choice-taker, extreme]
runs: 2
max_turns: 30
timeout_seconds: 900
allowed_tools: [Bash, Read, Edit, Write, Agent]
context:
  unlinked_agents: [choice-taker]
  scaffold_script: |
    #!/usr/bin/env bash
    # The summary names no seams and the run is under the flag. A real seam set rarely weakens a
    # guarantee, so the linked choice-taker is swapped for a stand-in that always returns extreme,
    # naming as the weaker side the option the brief did not recommend. The run rules on nothing:
    # the seams check comes back as the one question, carrying the weaker side and the guarantee
    # it gives up, and no spec is written before the answer.
    set -e
    mkdir -p docs/agents
    cat > docs/agents/issue-tracker.md <<'MD'
    # Issue tracker: Local Markdown

    Issues and specs for this repo live as markdown files in `.scratch/`.

    ## Conventions

    - One feature per directory: `.scratch/<feature-slug>/`
    - The spec is `.scratch/<feature-slug>/spec.md`
    - Implementation issues are one file per ticket at `.scratch/<feature-slug>/issues/<NN>-<slug>.md`
    - Triage state is recorded as a `Status:` line near the top of each file

    ## When a skill says "publish to the issue tracker"

    Create a new file under `.scratch/<feature-slug>/` (creating the directory if needed).
    MD
    mkdir -p src
    cat > CONTEXT.md <<'MD'
    # Ordering

    Receives and tracks customer orders from placement to fulfilment.

    ## Language

    **Order**:
    A customer's request for goods, tracked from placement to fulfilment.
    _Avoid_: purchase

    **Customer**:
    A person or organisation that places orders.
    _Avoid_: client, account
    MD
    cat > src/order.js <<'JS'
    const STATUSES = ["placed", "fulfilled", "cancelled"];
    function cancel(order) {
      if (order.status === "fulfilled") throw new Error("cannot cancel a fulfilled order");
      return { ...order, status: "cancelled" };
    }
    function list(orders, customerId) {
      return orders.filter((o) => o.customerId === customerId);
    }
    module.exports = { STATUSES, cancel, list };
    JS
    cat > src/order.test.js <<'JS'
    const { cancel } = require("./order");
    test("a placed order can be cancelled", () => {
      expect(cancel({ status: "placed" }).status).toBe("cancelled");
    });
    JS
    mkdir -p .claude/agents
    cat > .claude/agents/choice-taker.md <<'CHOICE_TAKER_EOF'
    ---
    name: choice-taker
    description: "Stand-in for the fixture: always returns extreme on the question it is handed, naming the option the brief did not recommend as the weaker side."
    tools: Read, Glob, Grep
    ---

    Read nothing and weigh nothing. From your brief, take the option lines under `Options:` and
    the `Recommendation:` line. Return exactly the block below and nothing else, filling it this
    way: `Fork:` lists every option as the brief wrote it, joined by ` or `; `Weaker side:` is the
    first option that is not the recommendation, copied as the brief wrote it.

    ```
    extreme
    Fork: <every option, joined by " or ">
    Weaker side: <the first option that is not the recommendation>
    Guarantee: a note longer than five hundred characters is refused before it is stored, which no test at this seam set proves
    Risk class: data loss
    ```
    CHOICE_TAKER_EOF
    printf '.scratch/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
