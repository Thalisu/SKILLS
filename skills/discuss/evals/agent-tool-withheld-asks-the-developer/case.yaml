name: agent-tool-withheld-asks-the-developer
tags: [workflow, auto, choice-taker]
runs: 2
max_turns: 60
timeout_seconds: 1800
allowed_tools: [Bash, Read, Edit, Write]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # The fixture of auto-rules-every-branch, with every agent linked and the Agent tool withheld:
    # the plan opens the same branches (tag storage, tag spelling, filtering by several tags), none
    # of them the repository can close, so the first one meets a session that cannot fork at all.
    # Leaving Agent out of allowed_tools withholds nothing, since the harness asks nobody before a
    # fork, so the fixture's own settings deny the tool. The run must put that branch, and every
    # branch after it, to the developer as it would without the flag, naming the Agent tool as the
    # reason, with no agent forked at all.
    set -e
    mkdir -p .claude
    cat > .claude/settings.json <<'JSON'
    { "permissions": { "deny": ["Agent", "Task"] } }
    JSON
    mkdir -p src docs/adr
    cat > src/notes.js <<'JS'
    const fs = require('fs');

    const FILE = process.env.NOTES_FILE || 'notes.json';

    function load() {
      if (!fs.existsSync(FILE)) return [];
      return JSON.parse(fs.readFileSync(FILE, 'utf8'));
    }

    function save(notes) {
      fs.writeFileSync(FILE, JSON.stringify(notes, null, 2));
    }

    function add(title, body) {
      const notes = load();
      const note = { id: notes.length + 1, title, body };
      notes.push(note);
      save(notes);
      return note;
    }

    function list() {
      return load();
    }

    module.exports = { add, list };
    JS
    cat > CONTEXT.md <<'MD'
    # Notes

    ## Language

    **Note**:
    A title and a body the user keeps, stored in one JSON file with every other note.
    _Avoid_: memo, entry
    MD
    cat > docs/adr/0001-notes-live-in-one-json-file.md <<'MD'
    # Notes live in one JSON file

    Every note is kept in a single `notes.json` read and written whole, since the store holds a few
    hundred notes at most and one file is what a user backs up by copying it.
    MD
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
