name: fixer-never-returns
tags: [fix, waves, retry]
runs: 1
max_turns: 120
timeout_seconds: 3000
allowed_tools: [Bash, Read, Write, Glob, Grep, Agent, Skill]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A branch whose Review the case wrote, with three Act on Findings the Wave script splits in two:
    # Findings 1 and 2 touch disjoint files, and neither file calls into the other, so no cut splits
    # them and they share Wave 1; Finding 3 names Finding 2's test file, so it runs in Wave 2. A project-level agent of the Fixer's name shadows the linked one:
    # on Finding 1 it ends its turn without writing the return file the brief names, whatever the
    # brief says, and on every other Finding it follows the linked definition as the Fixer does. The
    # Review sits under the ignored `.scratch/` and is never committed, so the tree reads clean.
    set -e
    mkdir -p src tests .claude/agents .scratch/reviews
    cat > package.json <<'JSON'
    { "name": "notes", "private": true, "scripts": { "test": "node --test tests/*.test.js" } }
    JSON
    cat > src/notes.js <<'JS'
    const notes = [];

    function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }

    function list() {
      return notes.filter((n) => n.status === "active");
    }

    function page(items, number, size) {
      const start = (number - 1) * size;
      return items.slice(start, start + size);
    }

    module.exports = { create, list, page };
    JS
    cat > tests/notes.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert/strict");
    const { create, list, page } = require("../src/notes");

    test("a created note is listed", () => {
      const note = create("first");
      assert.ok(list().some((n) => n.id === note.id));
    });

    test("a page holds the items of its slot", () => {
      assert.deepEqual(page([1, 2, 3], 1, 5), [1, 2, 3]);
    });
    JS
    cat > .claude/agents/do-code-review-fixer.md <<'MD'
    ---
    name: do-code-review-fixer
    description: 'The fixture stand-in for a Fixer that never returns on one Finding and fixes the others. Forked only by the do-code-review orchestrator with a brief, one per Act on Finding. Never on your own initiative.'
    model: sonnet
    effort: high
    tools: Bash, Read, Glob, Grep, Write, Edit, Agent, Skill
    maxTurns: 80
    ---

    You are the fixture's stand-in for the Fixer. Look at the location of the one Finding your brief
    hands you before anything else.

    When that location is in `src/notes.js`, you are the Fixer that never returns. End your turn at
    once with the single word `unavailable` and nothing else. Never create the return file the brief
    names, whatever the brief says, run no command and touch no file.

    For any other location, you are the Fixer itself. Print the definition at
    `$(readlink -f ~/.claude/skills/do-code-review)/agents/do-code-review-fixer.md` with one shell
    command, and follow everything below its frontmatter as your own instructions, with the brief you
    were handed.
    MD
    printf '.scratch/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git checkout -q -b export-notes
    cat > src/notes.js <<'JS'
    const notes = [];

    function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }

    function list() {
      return notes.filter((n) => n.status === "active");
    }

    function page(items, number, size) {
      const start = (number - 1) * size;
      return items.slice(start, start + size - 1);
    }

    module.exports = { create, list, page };
    JS
    cat > src/csv.js <<'JS'
    function row(fields) {
      return fields.map(String).join(",");
    }

    module.exports = { row };
    JS
    cat > src/export.js <<'JS'
    const { row } = require("./csv");

    function toCsv(notes) {
      const rows = [row(["id", "title"])];
      for (const note of notes) rows.push(row([note.id, note.title]));
      return rows.join(",");
    }

    module.exports = { toCsv };
    JS
    cat > tests/export.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert/strict");
    const { toCsv } = require("../src/export");

    test("an export opens with its header", () => {
      assert.ok(toCsv([]).startsWith("id,title"));
    });
    JS
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "feat(export): export notes as CSV"
    cat > .scratch/reviews/export-notes.md <<REVIEW_EOF
    # Review: export-notes

    Ticket: none
    Fixed point: main ($(git rev-parse --short main))
    Commit: $(git rev-parse --short HEAD)
    Base: main, inferred
    Spec source: no spec
    Mode: default, inferred
    Language: English, inferred

    ## Intent

    Export notes as CSV, a header then one row per note, and page a list of notes.

    ## Safe because

    The unit suite covers every exported function the diff touches, run in the fixture. Rung 4.

    ## Act on

    ### 1. Correctness at src/notes.js:15
    Claim: a page of ten over eleven items returns nine.
    Evidence: eleven items passed to \`page(items, 1, 10)\`; nine came back, the slice ends one short.
    Rung: 4
    Fix: a page of size ten over eleven items returns ten items, in tests/notes.test.js

    ### 2. Correctness at src/export.js:6
    Claim: the rows of an export are joined with a comma, so the whole CSV comes back as one line.
    Evidence: two notes passed in, \`toCsv(notes)\` returned \`id,title,1,first,2,second\` on a single line.
    Rung: 4
    Fix: an export of two notes holds three lines, the header and one per note, in tests/export.test.js

    ### 3. Correctness at src/csv.js:2
    Claim: a field holding a comma is written bare, so its row splits into one column too many.
    Evidence: \`row([1, "milk, eggs"])\` returned \`1,milk, eggs\`, three columns where two were written.
    Rung: 4
    Fix: a note titled \`milk, eggs\` exports as the row \`<id>,"milk, eggs"\`, in tests/export.test.js

    ## Consider

    none

    ## Noted

    none

    ## Cleared

    none

    ## Axes

    - Correctness: 3 findings, worst #1 (Act on)
    - Spec: no spec
    - Standards: 0 findings
    - Principles: 0 findings
    - Blast radius: 0 findings
    - Security: 0 findings
    REVIEW_EOF
