name: ref-does-not-resolve
tags: [refusal]
runs: 2
max_turns: 8
timeout_seconds: 300
allowed_tools: [Bash, Read, Write, Glob, Grep, Agent, Skill]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A repository with a branch and a diff; the prompt names a ref that does not exist.
    set -e
    mkdir -p src
    printf '{ "name": "notes", "private": true }\n' > package.json
    printf 'module.exports = { notes: [] };\n' > src/notes.js
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git checkout -q -b topic
    printf 'module.exports = { notes: [], archived: [] };\n' > src/notes.js
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -am "archive"
