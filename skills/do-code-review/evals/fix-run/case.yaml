name: fix-run
tags: [fix, landing]
runs: 1
max_turns: 90
timeout_seconds: 2400
allowed_tools: [Bash, Read, Write, Glob, Grep, Agent, Skill]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A branch whose Review the case wrote, with one Act on Finding against a planted correctness bug
    # (a page of ten over eleven items returns nine) and one Consider the fix must not touch. The tree
    # is clean and the Review is committed, so the fix door holds and the run fixes, verifies, appends
    # and lands on the branch the checkout is on.
    set -e
    mkdir -p src tests .scratch/reviews
    cat > package.json <<'JSON'
    { "name": "notes", "private": true, "scripts": { "test": "node --test tests/" } }
    JSON
    cat > CLAUDE.md <<'MD'
    # notes

    Rules for code under `src/`:

    - Never `console.log` in `src/`; write through `log()` from `src/log.js`.
    MD
    cat > src/log.js <<'JS'
    function log(...parts) {
      process.stderr.write(parts.join(" ") + "\n");
    }

    module.exports = { log };
    JS
    cat > src/notes.js <<'JS'
    const notes = [];

    function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }

    function list() {
      return notes.filter((n) => n.status === "active");
    }

    function page(items, number, size) {
      const start = (number - 1) * size;
      return items.slice(start, start + size);
    }

    module.exports = { create, list, page };
    JS
    cat > tests/notes.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert/strict");
    const { create, list, page } = require("../src/notes");

    test("a created note is listed", () => {
      const note = create("first");
      assert.ok(list().some((n) => n.id === note.id));
    });

    test("a page holds the items of its slot", () => {
      assert.deepEqual(page([1, 2, 3], 1, 5), [1, 2, 3]);
    });
    JS
    printf '.scratch/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git checkout -q -b export-notes
    cat > src/notes.js <<'JS'
    const notes = [];

    function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }

    function list() {
      return notes.filter((n) => n.status === "active");
    }

    function page(number, size, items) {
      const start = (number - 1) * size;
      return items.slice(start, start + size - 1);
    }

    module.exports = { create, list, page };
    JS
    cat > src/export.js <<'JS'
    const { list, page } = require("./notes");

    function toCsv() {
      const rows = [];
      let number = 1;
      for (;;) {
        const chunk = page(number, 10, list());
        if (chunk.length === 0) break;
        for (const note of chunk) rows.push([note.id, note.title].join(","));
        number += 1;
      }
      console.log("exported", rows.length);
      return rows.join("\n");
    }

    module.exports = { toCsv };
    JS
    cat > tests/notes.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert/strict");
    const { create, list, page } = require("../src/notes");

    test("a created note is listed", () => {
      const note = create("first");
      assert.ok(list().some((n) => n.id === note.id));
    });

    test("a page holds the items of its slot", () => {
      assert.deepEqual(page(1, 5, [1, 2, 3]), [1, 2, 3]);
    });
    JS
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "feat(export): export the active notes as CSV, a page at a time"
    cat > .scratch/reviews/export-notes.md <<REVIEW_EOF
    # Review: export-notes

    Ticket: none
    Fixed point: main ($(git rev-parse --short main))
    Commit: $(git rev-parse --short HEAD)
    Base: main, inferred
    Spec source: no spec
    Mode: default, inferred
    Language: English, inferred

    ## Intent

    Export the active notes as CSV, walking them through page one page at a time.

    ## Safe because

    The unit suite covers every exported function the diff touches, run in the fixture. Rung 4.

    ## Act on

    ### 1. Correctness at src/notes.js:15
    Claim: a page of ten over eleven items returns nine.
    Evidence: eleven items passed to \`page(1, 10, items)\`; nine came back, the slice ends one short.
    Rung: 4
    Fix: a page of size ten over eleven items returns ten items, in tests/notes.test.js

    ## Consider

    ### 2. Standards at src/export.js:14
    Claim: \`console.log\` in \`src/\`, which CLAUDE.md forbids.
    Evidence: CLAUDE.md, "Never \`console.log\` in \`src/\`; write through \`log()\` from \`src/log.js\`".
    Rung: 2
    Fix: the export writes through \`log()\`, in src/export.js

    ## Noted

    none

    ## Cleared

    none

    ## Axes

    - Correctness: 1 finding, worst #1 (Act on)
    - Spec: no spec
    - Standards: 1 finding, worst #2 (Consider)
    - Principles: 0 findings
    - Blast radius: 0 findings
    - Security: not run, no security reviewer installed
    REVIEW_EOF
