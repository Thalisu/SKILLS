name: fix-gate-red
tags: [fix, gate-fixer, landing]
runs: 1
max_turns: 120
timeout_seconds: 3000
allowed_tools: [Bash, Read, Write, Glob, Grep, Agent, Skill]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A branch whose Review the case wrote, with one Act on Finding against a planted paging bug (a
    # page of ten over eleven items returns nine), and a preview module outside the Finding that
    # asks for one item more than it shows to make up for that bug. The right fix to `page` turns
    # the preview's test red, so the Diff tests or the Gate go red after the Fixer committed and the
    # Gate fixer takes the red block. The right repair is in src/preview.js, never in the test's
    # assertion, and once it is made the run lands. The Review sits under the ignored `.scratch/`
    # and is never committed, so the tree reads clean and the fix door holds.
    set -e
    mkdir -p src tests .scratch/reviews
    cat > package.json <<'JSON'
    { "name": "notes", "private": true, "scripts": { "test": "node --test tests/*.test.js" } }
    JSON
    cat > CLAUDE.md <<'MD'
    # notes

    ### Project facts

    - **Unit**: full suite `npm test` · single file `node --test <file>`
    MD
    cat > src/notes.js <<'JS'
    const notes = [];

    function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }

    function list() {
      return notes.filter((n) => n.status === "active");
    }

    function page(items, number, size) {
      const start = (number - 1) * size;
      return items.slice(start, start + size);
    }

    module.exports = { create, list, page };
    JS
    cat > tests/notes.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert/strict");
    const { create, list, page } = require("../src/notes");

    test("a created note is listed", () => {
      const note = create("first");
      assert.ok(list().some((n) => n.id === note.id));
    });

    test("a page holds the items of its slot", () => {
      assert.deepEqual(page([1, 2, 3], 1, 5), [1, 2, 3]);
    });
    JS
    printf '.scratch/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git checkout -q -b export-notes
    cat > src/notes.js <<'JS'
    const notes = [];

    function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }

    function list() {
      return notes.filter((n) => n.status === "active");
    }

    function page(number, size, items) {
      const start = (number - 1) * size;
      return items.slice(start, start + size - 1);
    }

    module.exports = { create, list, page };
    JS
    cat > src/preview.js <<'JS'
    const { list, page } = require("./notes");

    const PREVIEW_SIZE = 10;

    function preview() {
      return page(1, PREVIEW_SIZE + 1, list());
    }

    module.exports = { preview, PREVIEW_SIZE };
    JS
    cat > tests/notes.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert/strict");
    const { create, list, page } = require("../src/notes");

    test("a created note is listed", () => {
      const note = create("first");
      assert.ok(list().some((n) => n.id === note.id));
    });

    test("a page holds the items of its slot", () => {
      assert.deepEqual(page(1, 5, [1, 2, 3]), [1, 2, 3]);
    });
    JS
    cat > tests/preview.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert/strict");
    const { create } = require("../src/notes");
    const { preview } = require("../src/preview");

    test("the preview shows the first ten active notes", () => {
      for (let i = 1; i <= 12; i += 1) create(`note ${i}`);
      const titles = Array.from({ length: 10 }, (_, i) => `note ${i + 1}`);
      assert.deepEqual(preview().map((n) => n.title), titles);
    });
    JS
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "feat(preview): show the first page of the active notes"
    node --test tests/*.test.js >/dev/null 2>&1
    cat > .scratch/reviews/export-notes.md <<REVIEW_EOF
    # Review: export-notes

    Ticket: none
    Fixed point: main ($(git rev-parse --short main))
    Commit: $(git rev-parse --short HEAD)
    Base: main, inferred
    Spec source: no spec
    Mode: default, inferred
    Language: English, inferred

    ## Intent

    Show the first page of the active notes as a preview, through the notes module's page.

    ## Safe because

    The unit suite covers every exported function the diff touches, run in the fixture. Rung 4.

    ## Act on

    ### 1. Correctness at src/notes.js:15
    Claim: a page of ten over eleven items returns nine.
    Evidence: eleven items passed to \`page(1, 10, items)\`; nine came back, the slice ends one short.
    Rung: 4
    Fix: a page of size ten over eleven items returns ten items, in tests/notes.test.js

    ## Consider

    none

    ## Noted

    none

    ## Cleared

    none

    ## Axes

    - Correctness: 1 finding, worst #1 (Act on)
    - Spec: no spec
    - Standards: 0 findings
    - Principles: 0 findings
    - Blast radius: 0 findings
    - Security: 0 findings
    REVIEW_EOF
