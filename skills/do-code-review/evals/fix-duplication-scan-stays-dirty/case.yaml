name: fix-duplication-scan-stays-dirty
tags: [fix, gate-fixer, duplication-scan, landing]
runs: 1
max_turns: 120
timeout_seconds: 3000
allowed_tools: [Bash, Read, Write, Glob, Grep, Agent, Skill]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A branch whose Review the case wrote, with one Act on Finding against a planted paging bug (a
    # page of ten over eleven items returns nine). The branch left a `makeNotes` factory in two test
    # files it wrote, as two test authors who could not see each other's work would, but the two
    # copies drifted: tests/notes.test.js's returns the created note objects, and
    # tests/export.test.js's returns plain titles. Each file calls its own `makeNotes` inside an
    # assertion, one reading `.status` off objects and one formatting titles, so one shared copy, or
    # a rename of either, changes an assertion line, which the Gate fixer's rule 5 ("no assertion
    # changed") forbids: its two attempts cannot clear the row and the duplication scan stays dirty
    # after both. The project's Duplication scan is a stand-in for
    # scan-test-assets.sh that prints the same sections and exits 0 on a dirty report. The Review
    # sits under the ignored `.scratch/` and is never committed, so the tree reads clean and the fix
    # door holds.
    set -e
    mkdir -p src tests .claude/testing-policy .scratch/reviews
    cat > package.json <<'JSON'
    { "name": "notes", "private": true, "scripts": { "test": "node --test tests/*.test.js" } }
    JSON
    cat > CLAUDE.md <<'MD'
    # notes

    ### Project facts

    - **Unit**: full suite `npm test` · single file `node --test <file>`
    - **Duplication scan**: `bash .claude/testing-policy/scan-test-assets.sh` · shared homes per role: factories in `tests/helpers/`
    MD
    cat > .claude/testing-policy/scan-test-assets.sh <<'SH'
    #!/usr/bin/env bash
    # A stand-in for the Testing Policy's scan-test-assets.sh over tests/, tests/helpers/ being the
    # shared home: the same "## <section>" headers, and each duplicate-symbols and local-factories row
    # as the scan prints it, the name, the count of files defining it and those files. Exit 0 whenever it ran.
    set -uo pipefail
    files="$(find tests -name '*.js' -not -path 'tests/helpers/*' | sort)"
    printf '\n## roots\ntests\n'
    printf '\n## duplicate-symbols\n'
    for f in $files; do
      grep -oE '^(async )?function [A-Za-z_$][A-Za-z0-9_$]*' "$f" | awk -v p="$f" '{n=split($0,a," "); print a[n] "\t" p}'
    done | sort -u | awk -F'\t' '{c[$1]++; f[$1]=f[$1] " " $2} END {for (k in c) if (c[k]>1) printf "%s\t%d\t%s\n", k, c[k], f[k]}' | sort
    printf '\n## local-factories\n'
    for f in $files; do
      grep -oE '^(function |const )(make|build|seed)[A-Z][A-Za-z0-9_]*' "$f" | awk -v p="$f" '{n=split($0,a," "); print a[n] "\t" p}'
    done | sort -u | awk -F'\t' '{c[$1]++; f[$1]=f[$1] " " $2} END {for (k in c) printf "%s\t%d\t%s\n", k, c[k], f[k]}' | sort
    exit 0
    SH
    cat > src/notes.js <<'JS'
    const notes = [];

    function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }

    function list() {
      return notes.filter((n) => n.status === "active");
    }

    function page(items, number, size) {
      const start = (number - 1) * size;
      return items.slice(start, start + size);
    }

    module.exports = { create, list, page };
    JS
    cat > tests/notes.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert/strict");
    const { create, list, page } = require("../src/notes");

    test("a created note is listed", () => {
      const note = create("first");
      assert.ok(list().some((n) => n.id === note.id));
    });

    test("a page holds the items of its slot", () => {
      assert.deepEqual(page([1, 2, 3], 1, 5), [1, 2, 3]);
    });
    JS
    printf '.scratch/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git checkout -q -b export-notes
    cat > src/notes.js <<'JS'
    const notes = [];

    function create(title) {
      const note = { id: notes.length + 1, title, status: "active" };
      notes.push(note);
      return note;
    }

    function list() {
      return notes.filter((n) => n.status === "active");
    }

    function page(number, size, items) {
      const start = (number - 1) * size;
      return items.slice(start, start + size - 1);
    }

    module.exports = { create, list, page };
    JS
    cat > src/export.js <<'JS'
    const { list, page } = require("./notes");

    function toCsv() {
      const rows = [];
      let number = 1;
      for (;;) {
        const chunk = page(number, 10, list());
        if (chunk.length === 0) break;
        for (const note of chunk) rows.push([note.id, note.title].join(","));
        number += 1;
      }
      return rows.join("\n");
    }

    module.exports = { toCsv };
    JS
    cat > tests/notes.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert/strict");
    const { create, list, page } = require("../src/notes");

    function makeNotes(count) {
      return Array.from({ length: count }, (_, i) => create(`note ${i + 1}`));
    }

    test("created notes are listed as active", () => {
      assert.deepEqual(makeNotes(2).map((n) => n.status), ["active", "active"]);
      assert.equal(list().length, 2);
    });

    test("a page holds the items of its slot", () => {
      assert.deepEqual(page(1, 5, [1, 2, 3]), [1, 2, 3]);
    });
    JS
    cat > tests/export.test.js <<'JS'
    const test = require("node:test");
    const assert = require("node:assert/strict");
    const { create } = require("../src/notes");
    const { toCsv } = require("../src/export");

    function makeNotes(count) {
      return Array.from({ length: count }, (_, i) => `note ${i + 1}`);
    }

    test("the export writes one row per active note", () => {
      for (const title of makeNotes(3)) create(title);
      assert.deepEqual(toCsv().split("\n"), makeNotes(3).map((title, i) => `${i + 1},${title}`));
    });
    JS
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "feat(export): export the active notes as CSV, a page at a time"
    node --test tests/*.test.js >/dev/null 2>&1
    cat > .scratch/reviews/export-notes.md <<REVIEW_EOF
    # Review: export-notes

    Ticket: none
    Fixed point: main ($(git rev-parse --short main))
    Commit: $(git rev-parse --short HEAD)
    Base: main, inferred
    Spec source: no spec
    Mode: default, inferred
    Language: English, inferred

    ## Intent

    Export the active notes as CSV, walking them through page one page at a time.

    ## Safe because

    The unit suite covers every exported function the diff touches, run in the fixture. Rung 4.

    ## Act on

    ### 1. Correctness at src/notes.js:15
    Claim: a page of ten over eleven items returns nine.
    Evidence: eleven items passed to \`page(1, 10, items)\`; nine came back, the slice ends one short.
    Rung: 4
    Fix: a page of size ten over eleven items returns ten items, in tests/notes.test.js

    ## Consider

    none

    ## Noted

    none

    ## Cleared

    none

    ## Axes

    - Correctness: 1 finding, worst #1 (Act on)
    - Spec: no spec
    - Standards: 0 findings
    - Principles: 0 findings
    - Blast radius: 0 findings
    - Security: 0 findings
    REVIEW_EOF
