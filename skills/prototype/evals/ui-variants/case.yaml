name: ui-variants
tags: [workflow, ui]
runs: 2
max_turns: 60
timeout_seconds: 900
allowed_tools: [Bash, Read, Edit, Write, Glob, Grep]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # A dependency-free static app with a settings page, so the ui shape has an existing route to
    # host its variants without a dev server or an install.
    set -e
    cat > index.html <<'HTML'
    <!doctype html>
    <html><head><meta charset="utf-8"><title>Home</title><link rel="stylesheet" href="app.css"></head>
    <body><header class="top"><a href="index.html">Home</a> <a href="settings.html">Settings</a></header>
    <main><h1>Home</h1></main></body></html>
    HTML
    cat > settings.html <<'HTML'
    <!doctype html>
    <html><head><meta charset="utf-8"><title>Settings</title><link rel="stylesheet" href="app.css"></head>
    <body><header class="top"><a href="index.html">Home</a> <a href="settings.html">Settings</a></header>
    <main id="settings">
      <h1>Settings</h1>
      <section><h2>Profile</h2><label>Name <input value="Ada"></label></section>
      <section><h2>Notifications</h2><label><input type="checkbox" checked> Email me</label></section>
      <section><h2>Export</h2><button>Export my data</button></section>
      <section><h2>Danger zone</h2><button>Delete account</button></section>
    </main>
    <script src="app.js"></script></body></html>
    HTML
    cat > app.css <<'CSS'
    body { font-family: system-ui; margin: 0; } .top { padding: 12px; border-bottom: 1px solid #ddd; } main { padding: 24px; }
    CSS
    cat > app.js <<'JS'
    document.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => alert(b.textContent)));
    JS
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
