name: auto-first-ticket-in-the-sibling-hands-over-by-absolute-path
tags: [workflow, auto, choice-taker, multi-repository, publish, close]
runs: 2
max_turns: 50
timeout_seconds: 1200
allowed_tools: [Bash, Read, Edit, Write, Agent]
context:
  unlinked_agents: [choice-taker]
  scaffold_script: |
    #!/usr/bin/env bash
    # The fixture is the Home repository, the orders service, with the billing service laid beside
    # it as a sibling, run under --auto with a choice-taker stand-in that rules to publish. The
    # journey is a chain of two paths that starts in the sibling: the refunded status in the
    # billing service, then the Refund line in the orders service, which reads that status. The
    # spec and the journey state that order outright, so the ticket numbered 01, the only one on
    # the frontier, is built in the repository the session is not in, and the two paths share no
    # repository, so nothing folds.
    set -e
    mkdir -p src docs/agents .scratch/show-refund-on-order .claude/agents
    cat > src/order.js <<'JS'
    const STATUSES = ["placed", "fulfilled", "cancelled"];
    const orders = [];
    function place(id) {
      const order = { id, status: "placed" };
      orders.push(order);
      return order;
    }
    function find(id) {
      return orders.find((o) => o.id === id) || null;
    }
    function view(order) {
      return [`Order ${order.id}`, `Status: ${order.status}`];
    }
    module.exports = { STATUSES, place, find, view };
    JS
    cat > src/order.test.js <<'JS'
    const { place, find } = require("./order");
    test("a placed order is found by its id", () => {
      place("o-1");
      expect(find("o-1").status).toBe("placed");
    });
    JS
    cat > src/billing-client.js <<'JS'
    const BILLING_URL = process.env.BILLING_URL || "http://localhost:4100";
    async function invoiceOf(orderId) {
      const res = await fetch(`${BILLING_URL}/invoices?order=${orderId}`);
      return res.ok ? res.json() : null;
    }
    module.exports = { invoiceOf };
    JS
    cat > docs/agents/issue-tracker.md <<'MD'
    # Issue tracker: Local Markdown

    Issues and specs for this repo live as markdown files in `.scratch/`.

    - One feature per directory: `.scratch/<feature-slug>/`
    - The spec is `.scratch/<feature-slug>/spec.md`
    - Implementation issues are one file per ticket at `.scratch/<feature-slug>/issues/<NN>-<slug>.md`, numbered from `01`
    - Triage state is a `Status:` line near the top of each issue file
    MD

    mkdir -p ../billing-service/src
    cat > ../billing-service/src/invoice.js <<'JS'
    const invoices = [];
    function open(orderId, amount) {
      const invoice = { orderId, amount, status: "open" };
      invoices.push(invoice);
      return invoice;
    }
    function pay(invoice) {
      invoice.status = "paid";
      return invoice;
    }
    function findByOrder(orderId) {
      return invoices.find((i) => i.orderId === orderId) || null;
    }
    module.exports = { open, pay, findByOrder };
    JS
    cat > ../billing-service/src/invoice.test.js <<'JS'
    const { open, pay } = require("./invoice");
    test("an open invoice can be paid", () => {
      expect(pay(open("o-1", 10)).status).toBe("paid");
    });
    JS
    cat > ../billing-service/src/console.js <<'JS'
    const { findByOrder } = require("./invoice");
    function show(orderId) {
      const invoice = findByOrder(orderId);
      if (!invoice) return ["No invoice for this order"];
      return [`Invoice for ${invoice.orderId}`, `Amount: ${invoice.amount}`, `Status: ${invoice.status}`];
    }
    module.exports = { show };
    JS

    home="$(pwd -P)"
    billing="$(cd ../billing-service && pwd -P)"
    cat > .scratch/show-refund-on-order/spec.md <<MD
    # Show the refund of an Invoice on its Order

    Journey: ./journey.md
    Status: ready-for-agent

    ## Problem Statement

    A customer asks for their money back on a paid Order. A support agent has no way to refund the
    Invoice in the billing service, and the Order's own page says nothing about a refund, so the
    agent cannot tell the customer whether the money went back.

    ## Solution

    A support agent refunds a paid Invoice from the billing console, and reads on the Order's page in
    the orders service that the Order's Invoice was refunded.

    ## Repositories

    - orders-service (Home repository): $home
    - billing-service: $billing

    ## User Stories

    1. As a support agent, I want to refund a paid Invoice, so that the customer gets their money back
    2. As a support agent, I want to see on the Order's page that its Invoice was refunded, so that I can tell the customer the money went back

    ## Implementation Decisions

    - An Invoice gains the status refunded, written by the billing service only, and the billing service's Invoice lookup returns it. The Refund action of the billing console and the refund operation are built in the billing service, in its invoice module and its console. This work reads nothing the orders service writes. Nothing in the orders service changes for it
    - The Refund line of the Order's page is built in the orders service, in its order module and its billing client module. It reads the refunded status from the billing service's Invoice lookup, so it cannot start before the billing service writes that status. Nothing in the billing service changes for it
    - The build order is fixed by what each piece reads: first the refunded status in the billing service, second the Refund line in the orders service
    - The orders service reaches the billing service through its one client module, the only place that knows the billing service's address

    ## Testing Decisions

    - In the billing service, behaviour tests through the invoice module's public functions
    - In the orders service, behaviour tests through the order module's public functions, with an in-memory stand-in for the billing client

    ## Out of Scope

    - Refunding part of an Invoice
    MD
    cat > .scratch/show-refund-on-order/journey.md <<'MD'
    # Journey: Show the refund of an Invoice on its Order

    Spec: ./spec.md
    Actor: support agent
    Entry: the Invoice in the billing console

    ## Path 1: Refund a paid Invoice

    Story: 1
    Outcome: the Invoice is on record as refunded in the billing service.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the Invoice in the billing console, status paid, with a Refund action | picks Refund | a confirmation asks "Refund this Invoice?" with the amount |
    | 2 | the confirmation | confirms | the Invoice shows status refunded and a line says "Invoice refunded" |
    | 3 | the refunded Invoice | nothing | the Refund action is gone |
    | 4 | the refunded Invoice | reloads the console | the Invoice still shows status refunded |

    Failure branches:
    - Refund confirmed on an Invoice that is already refunded: nothing changes and the line still says "Invoice refunded"
    - Refund picked on an open Invoice: the refund is refused and a line says "Only a paid Invoice can be refunded"

    ## Path 2: See the refund on the Order's page

    Story: 2
    Outcome: the Order's page in the orders service tells the support agent that the Order's Invoice was refunded.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the Order's page in the orders service | opens it | a Refund line under the status shows the Invoice's amount and its status |
    | 2 | the Refund line reading refunded | nothing | the line says "Refunded, the money went back" |
    | 3 | the Refund line reading paid | nothing | the line says "Paid, no refund" with the amount |
    | 4 | the Order's page | reloads after the Invoice was refunded | the Refund line now reads refunded |

    Failure branches:
    - The Order has no Invoice: the line says "No Invoice"
    - The billing service does not answer: the line says "Refund state unavailable" and the rest of the page still shows

    ## States

    | State | The actor sees | Actions |
    |---|---|---|
    | Invoice paid | the Invoice in the billing console with a Refund action; "Paid, no refund" on the Order's page | Refund (Path 1, to Invoice refunded) |
    | Invoice refunded | the Invoice in the billing console with no Refund action; written by Path 1 in the billing service, read by Path 2 in the orders service as "Refunded, the money went back" | none |

    Order of the paths, by what each reads: Path 1 first, it reads nothing another path writes; Path 2
    last, it reads the refunded status Path 1 writes.

    ## Cut

    - none

    ## Defaults taken

    - "Invoice refunded" uses the billing console's existing status line

    ## Deferred

    - Refunding from the Order's page: reopens when support agents refund more than ten Invoices a week

    ## Spec changes applied

    - none

    ## Reopen in discuss

    - none
    MD
    printf '.scratch/\n' > .gitignore
    cat > .claude/agents/choice-taker.md <<'CHOICE_TAKER_EOF'
    ---
    name: choice-taker
    description: "Stand-in for the fixture: always returns a settled Ruling on the option that publishes the breakdown."
    tools: Read, Glob, Grep
    ---

    Do not weigh the question. Among the lines under `Options:` in your brief, take the one under
    which the breakdown is published as it stands, copied verbatim, and every option line in its
    order. Return exactly this shape and nothing else, no line before it and none after, with that
    option in place of `<the publishing option>` and the options joined by ` or ` in place of
    `<options>`:

    ```
    settled
    Side: <the publishing option>
    Norm: no norm: the side easiest to undo
    Fork: <options>
    Losing criterion: none
    ```
    CHOICE_TAKER_EOF
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git -C ../billing-service init -q -b main
    git -C ../billing-service -c user.email=fixture@example.com -c user.name=fixture add -A
    git -C ../billing-service -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
