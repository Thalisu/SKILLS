name: no-screen-cuts-logic-alone
tags: [workflow, cut, kind, auto]
runs: 2
max_turns: 50
timeout_seconds: 1200
allowed_tools: [Bash, Read, Edit, Write, Agent]
context:
  unlinked_agents: [choice-taker]
  scaffold_script: |
    #!/usr/bin/env bash
    # A Spec that reads Front-end: builder over a journey whose two paths are both run from the
    # command line, with no edge between them: no path has a screen, so each is cut as a Logic
    # ticket alone, no Front-end ticket exists, and the line under the list says so. The run is
    # under --auto with a choice-taker stand-in that rules to publish, so the two tickets reach the
    # disk with their Kind lines.
    set -e
    mkdir -p src docs/agents .scratch/notes-cli .claude/agents
    cat > src/notes.js <<'JS'
    const notes = [];
    function create(title) {
      const note = { id: notes.length + 1, title };
      notes.push(note);
      return note;
    }
    function list() {
      return notes.slice();
    }
    module.exports = { create, list };
    JS
    cat > docs/agents/issue-tracker.md <<'MD'
    # Issue tracker: Local Markdown

    Issues and specs for this repo live as markdown files in `.scratch/`.

    - One feature per directory: `.scratch/<feature-slug>/`
    - The spec is `.scratch/<feature-slug>/spec.md`
    - Implementation issues are one file per ticket at `.scratch/<feature-slug>/issues/<NN>-<slug>.md`, numbered from `01`
    - Triage state is a `Status:` line near the top of each issue file
    MD
    cat > .scratch/notes-cli/spec.md <<'MD'
    # Notes command line

    Journey: ./journey.md
    Front-end: builder
    Status: ready-for-agent

    ## Problem Statement

    There is no way to take the notes out of the app or to bring notes written elsewhere into it.

    ## Solution

    The notes command line gains two commands: one exports the notes to a file, one imports notes
    from a file.

    ## User Stories

    1. As a writer, I want to export my notes to a file from the command line, so that I can keep a copy outside the app
    2. As a writer, I want to import notes from a file from the command line, so that notes I wrote elsewhere join my list

    ## Implementation Decisions

    - Both are commands of the notes command line, with no page, view or dialog in the app
    - The export writes one line per note, its title; the import creates one note per line of the file it is given
    - Neither command reads what the other writes: the import takes any text file, never only an exported one

    ## Testing Decisions

    - Behaviour tests through the notes module's public functions

    ## Out of Scope

    - Exporting or importing from inside the app
    MD
    cat > .scratch/notes-cli/journey.md <<'MD'
    # Journey: Notes command line

    Spec: ./spec.md
    Actor: writer
    Entry: a terminal

    ## Path 1: Export the notes

    Story: 1
    Outcome: a file holds one line per note.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | a terminal prompt | runs `notes export notes.txt` | the command writes one line per note to the file and prints "Exported 3 notes" |
    | 2 | the prompt again | nothing | the command exited with status 0 |

    Failure branches:
    - The file cannot be written: the command prints "Cannot write notes.txt" and exits with status 1

    ## Path 2: Import notes

    Story: 2
    Outcome: every line of the file is a note.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | a terminal prompt | runs `notes import drafts.txt` | the command creates one note per line of the file and prints "Imported 4 notes" |
    | 2 | the prompt again | nothing | the command exited with status 0 |

    Failure branches:
    - The file does not exist: the command prints "Cannot read drafts.txt" and exits with status 1
    - A blank line in the file: it is skipped and not counted

    ## States

    | State | The actor sees | Actions |
    |---|---|---|
    | stored | nothing: a note has one state, and both commands leave it as it is | Export (Path 1, stays stored); Import (Path 2, creates stored notes) |

    ## Cut

    - none

    ## Defaults taken

    - The commands print through the command line's existing output

    ## Deferred

    - none

    ## Spec changes applied

    - none

    ## Reopen in discuss

    - none
    MD
    printf '.scratch/\n' > .gitignore
    cat > .claude/agents/choice-taker.md <<'CHOICE_TAKER_EOF'
    ---
    name: choice-taker
    description: "Stand-in for the fixture: always returns a settled Ruling on the option that publishes the breakdown."
    tools: Read, Glob, Grep
    ---

    Do not weigh the question. Among the lines under `Options:` in your brief, take the one under
    which the breakdown is published as it stands, copied verbatim, and every option line in its
    order. Return exactly this shape and nothing else, no line before it and none after, with that
    option in place of `<the publishing option>` and the options joined by ` or ` in place of
    `<options>`:

    ```
    settled
    Side: <the publishing option>
    Norm: no norm: the side easiest to undo
    Fork: <options>
    Losing criterion: none
    ```
    CHOICE_TAKER_EOF
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
