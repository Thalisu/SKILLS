name: auto-publishes-two-services-in-one-folder
tags: [workflow, auto, choice-taker, multi-repository, publish]
runs: 2
max_turns: 50
timeout_seconds: 1200
allowed_tools: [Bash, Read, Edit, Write, Agent]
context:
  unlinked_agents: [choice-taker]
  scaffold_script: |
    #!/usr/bin/env bash
    # The fixture is the Home repository, the orders service, with the billing service laid beside
    # it as a sibling, run under --auto with a choice-taker stand-in that rules to publish. The
    # journey is a chain of three paths that alternates repositories: the disputed status in the
    # orders service, the hold in the billing service, which reads that status, and the Invoice
    # line back in the orders service, which reads the hold. The spec and the journey state that
    # order outright, so the numbering is no judgement call, and no two neighbours share a
    # repository, so nothing folds.
    set -e
    mkdir -p src docs/agents .scratch/hold-disputed-invoice .claude/agents
    cat > src/order.js <<'JS'
    const STATUSES = ["placed", "fulfilled", "cancelled"];
    const orders = [];
    function place(id) {
      const order = { id, status: "placed" };
      orders.push(order);
      return order;
    }
    function find(id) {
      return orders.find((o) => o.id === id) || null;
    }
    function view(order) {
      return [`Order ${order.id}`, `Status: ${order.status}`];
    }
    module.exports = { STATUSES, place, find, view };
    JS
    cat > src/order.test.js <<'JS'
    const { place, find } = require("./order");
    test("a placed order is found by its id", () => {
      place("o-1");
      expect(find("o-1").status).toBe("placed");
    });
    JS
    cat > src/billing-client.js <<'JS'
    const BILLING_URL = process.env.BILLING_URL || "http://localhost:4100";
    async function invoiceOf(orderId) {
      const res = await fetch(`${BILLING_URL}/invoices?order=${orderId}`);
      return res.ok ? res.json() : null;
    }
    module.exports = { invoiceOf };
    JS
    cat > docs/agents/issue-tracker.md <<'MD'
    # Issue tracker: Local Markdown

    Issues and specs for this repo live as markdown files in `.scratch/`.

    - One feature per directory: `.scratch/<feature-slug>/`
    - The spec is `.scratch/<feature-slug>/spec.md`
    - Implementation issues are one file per ticket at `.scratch/<feature-slug>/issues/<NN>-<slug>.md`, numbered from `01`
    - Triage state is a `Status:` line near the top of each issue file
    MD

    mkdir -p ../billing-service/src
    cat > ../billing-service/src/invoice.js <<'JS'
    const invoices = [];
    function open(orderId, amount) {
      const invoice = { orderId, amount, status: "open" };
      invoices.push(invoice);
      return invoice;
    }
    function pay(invoice) {
      invoice.status = "paid";
      return invoice;
    }
    function findByOrder(orderId) {
      return invoices.find((i) => i.orderId === orderId) || null;
    }
    module.exports = { open, pay, findByOrder };
    JS
    cat > ../billing-service/src/invoice.test.js <<'JS'
    const { open, pay } = require("./invoice");
    test("an open invoice can be paid", () => {
      expect(pay(open("o-1", 10)).status).toBe("paid");
    });
    JS
    cat > ../billing-service/src/orders-client.js <<'JS'
    const ORDERS_URL = process.env.ORDERS_URL || "http://localhost:4000";
    async function orderOf(orderId) {
      const res = await fetch(`${ORDERS_URL}/orders/${orderId}`);
      return res.ok ? res.json() : null;
    }
    module.exports = { orderOf };
    JS
    cat > ../billing-service/src/console.js <<'JS'
    const { findByOrder } = require("./invoice");
    function show(orderId) {
      const invoice = findByOrder(orderId);
      if (!invoice) return ["No invoice for this order"];
      return [`Invoice for ${invoice.orderId}`, `Amount: ${invoice.amount}`, `Status: ${invoice.status}`];
    }
    module.exports = { show };
    JS

    home="$(pwd -P)"
    billing="$(cd ../billing-service && pwd -P)"
    cat > .scratch/hold-disputed-invoice/spec.md <<MD
    # Hold the Invoice of a disputed Order

    Journey: ./journey.md
    Status: ready-for-agent

    ## Problem Statement

    A customer disputes an Order and the billing service keeps chasing its open Invoice. A support
    agent has no way to record the dispute on the Order, nobody can put the Invoice on hold, and
    the Order's own page says nothing about the Invoice.

    ## Solution

    A support agent marks an Order as disputed in the orders service, puts the Invoice of a disputed
    Order on hold from the billing console, and reads on the Order's page that the Invoice is on
    hold.

    ## Repositories

    - orders-service (Home repository): $home
    - billing-service: $billing

    ## User Stories

    1. As a support agent, I want to mark an Order as disputed, so that the dispute is on record where the Order lives
    2. As a support agent, I want to put the Invoice of a disputed Order on hold, so that the customer is not chased while the dispute is open
    3. As a support agent, I want to see on the Order's page that its Invoice is on hold, so that I can tell the customer nothing is due for now

    ## Implementation Decisions

    - An Order gains the status disputed, written by the orders service only, and the orders service's Order lookup returns it. This is built in the orders service, in its order module. Nothing in the billing service changes for it
    - An Invoice gains the status held. The Hold action of the billing console and the hold operation are built in the billing service, in its invoice module, its console and its orders client module. The console offers Hold only on the Invoice of an Order the orders service's lookup returns as disputed, so this work reads the disputed status and cannot start before the orders service writes it. Nothing in the orders service changes for it
    - The Invoice line of the Order's page is built in the orders service, in its order module and its billing client module. It shows on a disputed Order and reads the held status from the billing service's Invoice lookup, so it cannot start before the billing service writes that status. Nothing in the billing service changes for it
    - The build order is fixed by what each piece reads: first the disputed status in the orders service, second the hold in the billing service, third the Invoice line in the orders service
    - Each service reaches the other through its one client module, the only place that knows the other's address

    ## Testing Decisions

    - In the orders service, behaviour tests through the order module's public functions, with an in-memory stand-in for the billing client
    - In the billing service, behaviour tests through the invoice module's public functions, with an in-memory stand-in for the orders client

    ## Out of Scope

    - Resolving a dispute and releasing the hold
    MD
    cat > .scratch/hold-disputed-invoice/journey.md <<'MD'
    # Journey: Hold the Invoice of a disputed Order

    Spec: ./spec.md
    Actor: support agent
    Entry: the Order's page in the orders service

    ## Path 1: Mark an Order as disputed

    Story: 1
    Outcome: the Order is on record as disputed in the orders service.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the Order's page in the orders service, status placed, with a Dispute action | picks Dispute | a confirmation asks "Mark this Order as disputed?" |
    | 2 | the confirmation | confirms | the Order shows status disputed and a line says "Order disputed" |
    | 3 | the disputed Order | nothing | the Dispute action is gone |
    | 4 | the disputed Order | reloads the page | the Order still shows status disputed |

    Failure branches:
    - Dispute confirmed on an Order that is already disputed: nothing changes and the line still says "Order disputed"
    - Dispute picked on a cancelled Order: the dispute is refused and a line says "A cancelled Order cannot be disputed"

    ## Path 2: Put the Invoice of a disputed Order on hold

    Story: 2
    Outcome: the Invoice is held and the billing console no longer shows it as due.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the Invoice in the billing console, status open, its Order shown as disputed, with a Hold action | picks Hold | a confirmation asks "Hold this Invoice?" with the amount |
    | 2 | the confirmation | confirms | the Invoice shows status held and a line says "Invoice on hold" |
    | 3 | the held Invoice | nothing | the Hold action is gone and the amount due reads zero |
    | 4 | the held Invoice | reloads the console | the Invoice still shows status held |

    Failure branches:
    - The Invoice's Order is not disputed: the console shows no Hold action and a line says "Only the Invoice of a disputed Order can be held"
    - The orders service does not answer: the console shows no Hold action and a line says "Order state unavailable"

    ## Path 3: See the hold on the disputed Order's page

    Story: 3
    Outcome: the Order's page in the orders service tells the support agent that the Order's Invoice is on hold.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the disputed Order's page in the orders service | opens it | an Invoice line under the status shows the Invoice's amount and its status |
    | 2 | the Invoice line reading held | nothing | the line says "On hold, nothing due for now" |
    | 3 | the Invoice line reading open | nothing | the line says "Still due" with the amount |
    | 4 | the Order's page | reloads after the Invoice was held | the Invoice line now reads held |

    Failure branches:
    - The Order has no Invoice: the line says "No Invoice"
    - The billing service does not answer: the line says "Invoice state unavailable" and the rest of the page still shows

    ## States

    | State | The actor sees | Actions |
    |---|---|---|
    | Order placed | the Order's page with a Dispute action, no Invoice line | Dispute (Path 1, to Order disputed) |
    | Order disputed | the Order's page with no Dispute action; written by Path 1 in the orders service, read by Path 2 in the billing service and by Path 3 | none on the Order |
    | Invoice open | the Invoice in the billing console, a Hold action when its Order is disputed; "Still due" on the Order's page | Hold (Path 2, to Invoice held) |
    | Invoice held | the Invoice in the billing console with no Hold action; written by Path 2 in the billing service, read by Path 3 in the orders service as "On hold, nothing due for now" | none |

    Order of the paths, by what each reads: Path 1 first, it reads nothing another path writes; Path 2
    second, it reads the disputed status Path 1 writes; Path 3 last, it reads the held status Path 2
    writes.

    ## Cut

    - none

    ## Defaults taken

    - "Order disputed" and "Invoice on hold" use each service's existing status line

    ## Deferred

    - Holding the Invoice automatically when the Order is disputed: reopens when support agents hold more than ten a week by hand

    ## Spec changes applied

    - none

    ## Reopen in discuss

    - none
    MD
    printf '.scratch/\n' > .gitignore
    cat > .claude/agents/choice-taker.md <<'CHOICE_TAKER_EOF'
    ---
    name: choice-taker
    description: "Stand-in for the fixture: always returns a settled Ruling on the option that publishes the breakdown."
    tools: Read, Glob, Grep
    ---

    Do not weigh the question. Among the lines under `Options:` in your brief, take the one under
    which the breakdown is published as it stands, copied verbatim, and every option line in its
    order. Return exactly this shape and nothing else, no line before it and none after, with that
    option in place of `<the publishing option>` and the options joined by ` or ` in place of
    `<options>`:

    ```
    settled
    Side: <the publishing option>
    Norm: no norm: the side easiest to undo
    Fork: <options>
    Losing criterion: none
    ```
    CHOICE_TAKER_EOF
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git -C ../billing-service init -q -b main
    git -C ../billing-service -c user.email=fixture@example.com -c user.name=fixture add -A
    git -C ../billing-service -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
