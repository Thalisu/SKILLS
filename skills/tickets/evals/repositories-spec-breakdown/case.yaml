name: repositories-spec-breakdown
tags: [workflow, cut, multi-repository]
runs: 2
max_turns: 20
timeout_seconds: 600
allowed_tools: [Bash, Read, Edit, Write, Agent]
context:
  scaffold_script: |
    #!/usr/bin/env bash
    # The fixture is the Home repository, the orders service, and the billing service is a sibling
    # laid beside it. The spec lists both under Repositories with the absolute paths this machine
    # gives them, so the scaffold computes them. The journey has two paths, each built in one
    # repository only: the void in the billing service, the Order's Invoice line in the orders
    # service. Each path carries six criteria, so each ticket is small and the two merged would be
    # large: nothing folds, and no ticket needs two repositories.
    set -e
    mkdir -p src docs/agents .scratch/void-cancelled-invoice
    cat > src/order.js <<'JS'
    const STATUSES = ["placed", "fulfilled", "cancelled"];
    function cancel(order) {
      if (order.status === "fulfilled") throw new Error("cannot cancel a fulfilled order");
      return { ...order, status: "cancelled" };
    }
    function view(order) {
      return [`Order ${order.id}`, `Status: ${order.status}`];
    }
    module.exports = { STATUSES, cancel, view };
    JS
    cat > src/order.test.js <<'JS'
    const { cancel } = require("./order");
    test("a placed order can be cancelled", () => {
      expect(cancel({ id: "o-1", status: "placed" }).status).toBe("cancelled");
    });
    JS
    cat > src/billing-client.js <<'JS'
    const BILLING_URL = process.env.BILLING_URL || "http://localhost:4100";
    async function invoiceOf(orderId) {
      const res = await fetch(`${BILLING_URL}/invoices?order=${orderId}`);
      return res.ok ? res.json() : null;
    }
    module.exports = { invoiceOf };
    JS
    cat > docs/agents/issue-tracker.md <<'MD'
    # Issue tracker: Local Markdown

    Issues and specs for this repo live as markdown files in `.scratch/`.

    - One feature per directory: `.scratch/<feature-slug>/`
    - The spec is `.scratch/<feature-slug>/spec.md`
    - Implementation issues are one file per ticket at `.scratch/<feature-slug>/issues/<NN>-<slug>.md`, numbered from `01`
    - Triage state is a `Status:` line near the top of each issue file
    MD

    mkdir -p ../billing-service/src
    cat > ../billing-service/src/invoice.js <<'JS'
    const invoices = [];
    function open(orderId, amount) {
      const invoice = { orderId, amount, status: "open" };
      invoices.push(invoice);
      return invoice;
    }
    function pay(invoice) {
      invoice.status = "paid";
      return invoice;
    }
    function findByOrder(orderId) {
      return invoices.find((i) => i.orderId === orderId) || null;
    }
    module.exports = { open, pay, findByOrder };
    JS
    cat > ../billing-service/src/invoice.test.js <<'JS'
    const { open, pay } = require("./invoice");
    test("an open invoice can be paid", () => {
      expect(pay(open("o-1", 10)).status).toBe("paid");
    });
    JS
    cat > ../billing-service/src/console.js <<'JS'
    const { findByOrder } = require("./invoice");
    function show(orderId) {
      const invoice = findByOrder(orderId);
      if (!invoice) return ["No invoice for this order"];
      return [`Invoice for ${invoice.orderId}`, `Amount: ${invoice.amount}`, `Status: ${invoice.status}`];
    }
    module.exports = { show };
    JS

    home="$(pwd -P)"
    billing="$(cd ../billing-service && pwd -P)"
    cat > .scratch/void-cancelled-invoice/spec.md <<MD
    # Void the Invoice of a cancelled Order

    Journey: ./journey.md
    Status: ready-for-agent

    ## Problem Statement

    A cancelled Order keeps an open Invoice in the billing service. Nobody can void it, and the
    Order's own page says nothing about the Invoice, so a support agent cannot tell a customer
    whether they still owe anything.

    ## Solution

    A support agent voids an open Invoice from the billing console, and the Order's page in the
    orders service shows the state of that Order's Invoice.

    ## Repositories

    - orders-service (Home repository): $home
    - billing-service: $billing

    ## User Stories

    1. As a support agent, I want to void an open Invoice, so that a cancelled Order is no longer owed
    2. As a support agent, I want to see the state of an Order's Invoice on the Order's page, so that I can tell the customer whether anything is owed

    ## Implementation Decisions

    - An Invoice carries a status: open, paid or voided. Voiding never deletes the Invoice
    - The void operation and the Void action of the billing console are built in the billing service, in its invoice module and its console. Nothing in the orders service changes for them
    - The Invoice line of the Order's page is built in the orders service, in its order module and its billing client module. It reads the Invoice by the lookup the billing service already exposes, which returns the status, so nothing in the billing service changes for it
    - The billing client module stays the only place in the orders service that knows the billing service's address

    ## Testing Decisions

    - In the billing service, behaviour tests through the invoice module's public functions
    - In the orders service, behaviour tests through the order module's public functions, with an in-memory stand-in for the billing client

    ## Out of Scope

    - Refunding a paid Invoice
    MD
    cat > .scratch/void-cancelled-invoice/journey.md <<'MD'
    # Journey: Void the Invoice of a cancelled Order

    Spec: ./spec.md
    Actor: support agent
    Entry: the billing console, on an Order's Invoice

    ## Path 1: Void an open Invoice

    Story: 1
    Outcome: the Invoice is voided and the support agent sees that nothing is owed on it.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the Invoice in the billing console, status open, with a Void action | picks Void | a confirmation asks "Void this Invoice?" with the amount |
    | 2 | the confirmation | confirms | the Invoice shows status voided and a line says "Invoice voided" |
    | 3 | the voided Invoice | nothing | the Void action is gone and the amount owed reads zero |
    | 4 | the voided Invoice | reloads the console | the Invoice still shows status voided |

    Failure branches:
    - Void confirmed on an Invoice that is already voided: nothing changes and the line still says "Invoice voided"
    - Void picked on a paid Invoice: the void is refused and a line says "A paid Invoice cannot be voided"

    ## Path 2: See the Invoice's state on a cancelled Order

    Story: 2
    Outcome: the Order's page in the orders service tells the support agent whether the Order's Invoice is still owed.

    | Step | Actor sees | Actor does | System answers |
    |---|---|---|---|
    | 1 | the Order's page in the orders service, status cancelled | opens it | an Invoice line under the status shows the Invoice's amount and its status |
    | 2 | the Invoice line reading voided | nothing | the line says "Nothing owed" |
    | 3 | the Invoice line reading open | nothing | the line says "Still owed" with the amount |
    | 4 | the Order's page | reloads after the Invoice was voided | the Invoice line now reads voided |

    Failure branches:
    - The Order has no Invoice: the line says "No Invoice"
    - The billing service does not answer: the line says "Invoice state unavailable" and the rest of the page still shows

    ## States

    | State | The actor sees | Actions |
    |---|---|---|
    | open | the Invoice in the billing console with a Void action; "Still owed" on the Order's page | Void (Path 1, to voided) |
    | voided | the Invoice in the billing console with no Void action; "Nothing owed" on the Order's page (Path 2) | none |
    | paid | the Invoice in the billing console; a void is refused | none |

    ## Cut

    - none

    ## Defaults taken

    - "Invoice voided" uses the billing console's existing status line

    ## Deferred

    - Voiding the Invoice automatically when the Order is cancelled: reopens when support agents void more than ten a week by hand

    ## Spec changes applied

    - none

    ## Reopen in discuss

    - none
    MD
    printf '.scratch/\n' > .gitignore
    git init -q -b main
    git -c user.email=fixture@example.com -c user.name=fixture add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
    git -C ../billing-service init -q -b main
    git -C ../billing-service -c user.email=fixture@example.com -c user.name=fixture add -A
    git -C ../billing-service -c user.email=fixture@example.com -c user.name=fixture commit -q -m "fixture"
